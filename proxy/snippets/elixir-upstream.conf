# Prefer locally running elixir on the host (mix phx.server on :4000),
# fall back to the dockerized elixir container if host is unreachable.
# Passive failover only — nginx OSS has no active health checks.
upstream elixir_backend {
    server host.docker.internal:4000 max_fails=1 fail_timeout=5s;
    server elixir:4000 backup;
}
