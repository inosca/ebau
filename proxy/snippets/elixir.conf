location /api/v2/ {
    chunked_transfer_encoding on;
    proxy_set_header X-NginX-Proxy true;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_buffering off;
    proxy_connect_timeout 1s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_pass http://elixir_backend;
}

location ~ ^/live/ {
    chunked_transfer_encoding on;
    proxy_set_header X-NginX-Proxy true;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_buffering off;

    proxy_connect_timeout 1s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_pass http://elixir_backend;
}

location ~ ^/phoenix/live_reload {
    chunked_transfer_encoding on;
    proxy_set_header X-NginX-Proxy true;
    proxy_buffering off;

    proxy_set_header Upgrade   $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host      $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 1s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_pass http://elixir_backend;
}

# Pages served by Phoenix (LiveView). Other /service-permissions
# subpages are still owned by the Ember app.
location = /service-permissions/gis-links {
    add_header Content-Security-Policy $csp_header_portal;

    proxy_connect_timeout 1s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_pass http://elixir_backend;
}

# Phoenix elixir routes
location ~ ^/elixir/ {
    proxy_connect_timeout 1s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_pass http://elixir_backend;
}

# Phoenix asset bundles. The Ember assets live directly under
# /assets/ (plus images/ and fonts/), so js/ and css/ are unique
# to Phoenix.
location ~ ^/assets/(js|css)/ {
    proxy_connect_timeout 1s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_pass http://elixir_backend;
}
