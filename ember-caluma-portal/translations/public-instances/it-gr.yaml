publicInstances:
  intro: "Il Comune stabilisce la forma dell'esposizione pubblica (ad es. tramite eBau o in loco). Se una domanda di costruzione non figura nell'elenco, rivolgersi per favore all'ufficio tecnico del Comune competente."
  empty-title: ""
  emptyText: "Attualmente in questo Comune non vi sono domande di costruzione visionabili pubblicamente tramite eBau. Informazioni relative a una determinata domanda di costruzione sono disponibili presso l'ufficio tecnico del Comune competente."

publicInstancesDetail:
  form-intro: "Conformemente a quanto indicato nell'organo di pubblicazione del Comune e/o nel Foglio ufficiale cantonale, la domanda di costruzione è esposta pubblicamente fino al {date}."
  copyrightText: "Rendiamo attenti al fatto che tutti i documenti salvati potrebbero essere protetti da copyright. L'ulteriore utilizzo dei documenti è consentito solo con il consenso esplicito della/del progettista o della persona che ne detiene la proprietà intellettuale."
  privacyText: "Per motivi legati alla protezione dei dati qui vengono pubblicati solo i documenti rilevanti per la procedura per il rilascio della licenza edilizia che il comune non ha classificato esplicitamente come confidenziali e non accessibili pubblicamente."
