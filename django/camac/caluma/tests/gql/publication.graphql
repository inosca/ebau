query {
  cases: allCases {
    edges {
      node {
        id
      }
    }
  }
  documents: allDocuments {
    edges {
      node {
        id
        answers {
          edges {
            node {
              id
            }
          }
        }
      }
    }
  }
  workItems: allWorkItems {
    edges {
      node {
        id
      }
    }
  }
}
