        Leitungen"}]}], "LogoPLRCadastreRef": "https://www.oereb2.apps.be.ch/image/logo/oereb/de.png",
        "FederalLogoRef": "https://www.oereb2.apps.be.ch/image/logo/confederation/de.png",
        "CantonalLogoRef": "https://www.oereb2.apps.be.ch/image/logo/canton/de.png",
        "MunicipalityLogoRef": "https://www.oereb2.apps.be.ch/image/logo/municipality/de.png?fosnr=351",
        "QRCodeRef": "https://www.oereb2.apps.be.ch/image/qrcode?extract_url=https%3A%2F%2Fwww.oereb2.apps.be.ch%2Fextract%2Fjson%3FEGRID%3DCH968746351115%26LANG%3Dde",
        "GeneralInformation": [[{"Language": "de", "Text": "Der Inhalt des \u00d6REB-Katasters
        wird als bekannt vorausgesetzt. Der Kanton Bern ist f\u00fcr die Genauigkeit
        und Verl\u00e4sslichkeit der gesetzgebenden Dokumente in elektronischer Form
        nicht haftbar. Der Auszug hat rein informativen Charakter und begr\u00fcndet
        insbesondere keine Rechte und Pflichten. Massgeblich sind diejenigen Dokumente,
        welche rechtskr\u00e4ftig verabschiedet oder ver\u00f6ffentlicht worden sind.
        Weitere Informationen zum \u00d6REB-Kataster finden Sie unter www.cadastre.ch"}]],
        "Disclaimer": [{"Title": [{"Language": "de", "Text": "Eigentumsbeschr\u00e4nkungen
        im Grundbuch"}], "Content": [{"Language": "de", "Text": "Zus\u00e4tzlich zu
        den Angaben in diesem Auszug k\u00f6nnen Eigentumsbeschr\u00e4nkungen auch
        im Grundbuch angemerkt sein."}]}, {"Title": [{"Language": "de", "Text": "Haftungsausschluss
        Kataster der belasteten Standorte (KbS)"}], "Content": [{"Language": "de",
        "Text": "Der Kataster der belasteten Standorte (KbS) wurde anhand der vom
        Bundesamt f\u00fcr Umwelt BAFU festgelegten Kriterien erstellt und wird fortw\u00e4hrend
        aufgrund neuer Erkenntnisse (z.B. Untersuchungen) aktualisiert. Die im KbS
        eingetragenen Fl\u00e4chen k\u00f6nnen vom tats\u00e4chlichen Ausmass der
        Belastung abweichen. Erscheint ein Grundst\u00fcck nicht im KbS, besteht keine
        absolute Gew\u00e4hr, dass das Areal frei von jeglichen Abfall- oder Schadstoffbelastungen
        ist. Bahnbetrieblich, milit\u00e4risch und f\u00fcr die Luftfahrt genutzte
        Standorte liegen im Zust\u00e4ndigkeitsbereich des Bundes."}]}, {"Title":
        [{"Language": "de", "Text": "Hinweis L\u00e4rmempfindlichkeitsstufen (in Nutzungszonen)"}],
        "Content": [{"Language": "de", "Text": "Im Kanton Bern werden die L\u00e4rmempfindlichkeitsstufen
        in vielen Gemeinden ausschliesslich im Baureglement definiert und daher im
        \u00d6REB-Katasterauszug nicht explizit ausgewiesen. F\u00fcr Informationen
        zur L\u00e4rmempfindlichkeit muss somit das im Thema kommunale Nutzungsplanung
        als Rechtsvorschrift hinterlegte Baureglement konsultiert werden."}]}, {"Title":
        [{"Language": "de", "Text": "Hinweis kommunale Nutzungsplanung"}], "Content":
        [{"Language": "de", "Text": "Im Kanton Bern sind die Verkehrsfl\u00e4chen
        in den kommunalen Zonenpl\u00e4nen nicht immer explizit einer Grundnutzungszone
        zugewiesen (\u00abweisse Fl\u00e4chen\u00bb). Bei den im \u00d6REB-Kataster
        abgebildeten Daten handelt es sich daher in diesen Bereichen um eine Beurteilung
        und Anwendung gem\u00e4ss der bekannten Rechtsprechung."}]}, {"Title": [{"Language":
        "de", "Text": "Hinweis Wirkungsfl\u00e4chen (von linien- und punktf\u00f6rmigen
        Festlegungen)"}], "Content": [{"Language": "de", "Text": "Bei linien- und
        punktf\u00f6rmigen Festlegungen kann in der Rechtsvorschrift eine Abstandsvorschrift
        definiert sein, die auch eine Auswirkung auf umliegende Grundst\u00fccke haben
        kann. Die aus der Abstandsvorschrift resultierende Wirkungsfl\u00e4che wird
        bei der Auswertung eines Grundst\u00fccks nicht aufgef\u00fchrt. Daher ist
        es empfehlenswert, sich ebenfalls einen \u00dcberblick \u00fcber die nahegelegenen
        linien- und punktf\u00f6rmigen Festlegungen und deren Rechtsvorschriften zu
        verschaffen."}]}, {"Title": [{"Language": "de", "Text": "Hinweis \u00c4nderungen"}],
        "Content": [{"Language": "de", "Text": "Bei folgenden Themen werden allf\u00e4llige
        \u00c4nderungen angezeigt: Sicherheitszonenplan, kantonale Naturschutzgebiete.
        Bei allen anderen Themen informiert der \u00d6REB-Kataster momentan nicht
        \u00fcber \u00c4nderungen."}]}, {"Title": [{"Language": "de", "Text": "Hinweis
        Landumlegungen"}], "Content": [{"Language": "de", "Text": "Befindet sich ein
        Grundst\u00fcck in einer Landumlegung, so beginnt die Grundst\u00fccksnummer
        im Kanton Bern mit einem Pr\u00e4fix. Zwischen dem Neulandantritt und dem
        Eintrag ins Grundbuch wird auch beim E-GRID eine inoffizielle Bezeichnung
        generiert."}]}], "Glossary": [{"Title": [{"Language": "de", "Text": "Arch\u00e4ologisches
        Inventar"}], "Content": [{"Language": "de", "Text": "Das Arch\u00e4ologische
        Inventar enth\u00e4lt s\u00e4mtliche arch\u00e4ologischen Schutzgebiete und
        bekannten Fundstellen des Kantons Bern. Arch\u00e4ologische Funde sind Eigentum
        des Kantons Bern. Grabungen und der Einsatz von Metalldetektoren ohne Bewilligung
        sind strafbar. Sollten Bauvorhaben in einem arch\u00e4ologischen Schutzgebiet
        oder in der N\u00e4he von arch\u00e4ologischen Fundstellen liegen, so ist
        ein fr\u00fchzeitiger Kontakt zum Arch\u00e4ologischen Dienst empfohlen."}]},
        {"Title": [{"Language": "de", "Text": "\u00c4nderungen"}], "Content": [{"Language":
        "de", "Text": "Bei \u00c4nderungen handelt es sich um geplante oder neue \u00d6REB,
        welche ab der \u00f6ffentlichen Auflage im \u00d6REB-Kataster gef\u00fchrt
        werden k\u00f6nnen. \u00c4nderungen k\u00f6nnen je nach rechtlicher Grundlage
        mit der \u00f6ffentlichen Auflage bereits eine Vorwirkung entfalten."}]},
        {"Title": [{"Language": "de", "Text": "Bauinventar"}], "Content": [{"Language":
        "de", "Text": "Das Bauinventar enth\u00e4lt alle sch\u00fctzens- und erhaltenswerten
        Baudenkm\u00e4ler des Kantons Bern (Einzelobjekte sowie Bau- und Strukturgruppen)."}]},
        {"Title": [{"Language": "de", "Text": "Baulinien Eisenbahnanlagen"}], "Content":
        [{"Language": "de", "Text": "Zwischen den Baulinien d\u00fcrfen keine baulichen
        Ver\u00e4nderungen vorgenommen oder sonstige Massnahmen getroffen werden,
        die dem Zweck bestehender oder k\u00fcnftiger Eisenbahnanlagen widersprechen."}]},
        {"Title": [{"Language": "de", "Text": "Baulinien Flughafenanlagen"}], "Content":
        [{"Language": "de", "Text": "Zwischen den Baulinien d\u00fcrfen keine baulichen
        Ver\u00e4nderungen vorgenommen oder sonstige Massnahmen getroffen werden,
        die dem Zweck bestehender oder k\u00fcnftiger Flughafenanlagen widersprechen."}]},
        {"Title": [{"Language": "de", "Text": "Baulinien Kantonsstrassen"}], "Content":
        [{"Language": "de", "Text": "Zwischen kantonaler Strassenbaulinie und Fahrbahnrand
        besteht ein Bauverbot. Dieses geht rechtlich den allgemeinen Abstandsvorschriften
        vor. Wurde keine Strassenbaulinie festgelegt, so gilt entlang von Kantonsstrassen
        beidseitig der gesetzlich vorgeschriebene Bauverbotsstreifen von 5m ab Fahrbahnrand."}]},
        {"Title": [{"Language": "de", "Text": "Baulinien Nationalstrassen"}], "Content":
        [{"Language": "de", "Text": "Wenn der projektierte Strassenverlauf definitiv
        bekannt ist, werden beiderseits der Strasse Baulinien festgelegt. Diese Baulinien
        erm\u00f6glichen es, die Anforderungen der Verkehrssicherheit und der Wohnhygiene
        sowie die Erfordernisse eines eventuellen k\u00fcnftigen Ausbaus der Strasse
        zu ber\u00fccksichtigen. Zwischen den Baulinien d\u00fcrfen ohne Bewilligung
        weder Neubauten erstellt noch Umbauten bestehender Geb\u00e4ude vorgenommen
        werden, auch wenn diese nur teilweise in die Baulinien hineinragen."}]}, {"Title":
        [{"Language": "de", "Text": "Baulinien Starkstromanlagen"}], "Content": [{"Language":
        "de", "Text": "Zwischen den Baulinien d\u00fcrfen keine baulichen Ver\u00e4nderungen
        vorgenommen oder sonstige Massnahmen getroffen werden, die dem Zweck bestehender
        oder k\u00fcnftiger Starkstromanlagen widersprechen."}]}, {"Title": [{"Language":
        "de", "Text": "BFS-Nr."}], "Content": [{"Language": "de", "Text": "Gemeindenummer
        aus amtlichem Gemeindeverzeichnis; Eine vom schweizerischen Bundesamt f\u00fcr
        Statistik mit dem Amtlichen Gemeindeverzeichnis im Jahre 1986 erstmals vergebene
        Zahl, die der eineindeutigen Bezeichnung von territorialen Einheiten im Einzugsbereich
        der Schweiz dient."}]}, {"Title": [{"Language": "de", "Text": "E-GRID"}],
        "Content": [{"Language": "de", "Text": "Eidgen\u00f6ssischer Grundst\u00fccksidentifikator;
        Aus einem Pr\u00e4fix und einer Nummer bestehende Bezeichnung, die es erlaubt,
        jedes in das Grundbuch aufgenommene Grundst\u00fcck landesweit eindeutig zu
        identifizieren, und die zum Datenaustausch zwischen Informatiksystemen dient."}]},
        {"Title": [{"Language": "de", "Text": "Eigentumsbeschr\u00e4nkung"}], "Content":
        [{"Language": "de", "Text": "Der Zweck aller Eigentumsbeschr\u00e4nkungen
        ist die Wahrung von Interessen anderer Personen, denen jene des Eigent\u00fcmers
        sich in bestimmter Beziehung unterordnen m\u00fcssen. Dies sind entweder die
        Eigent\u00fcmer angrenzender Grundst\u00fccke, die Nachbarn, oder auch weitere
        Kreise von Privatpersonen oder endlich die Allgemeinheit selber, der Staat.
        Die Beschr\u00e4nkungen zugunsten der Nachbarn oder weiterer Privatpersonen
        sind regelm\u00e4ssig privatrechtlicher, jene zugunsten der Allgemeinheit
        \u00f6ffentlich-rechtlicher Natur."}]}, {"Title": [{"Language": "de", "Text":
        "Gesch\u00fctzte botanische Objekte"}], "Content": [{"Language": "de", "Text":
        "Die gesch\u00fctzten botanischen Objekte umfassen Naturdenkm\u00e4ler wie
        Einzelb\u00e4ume, Baumgruppen, Feldgeh\u00f6lze, Hecken, Alleen, Parkbest\u00e4nde
        sowie kleinere Pflanzenschutzgebiete. Jegliche Ver\u00e4nderung am Objekt
        oder in der Umgebung, welche die nat\u00fcrliche Entwicklung beeintr\u00e4chtigt,
        ist ohne Bewilligung des Amts f\u00fcr Landwirtschaft und Natur verboten."}]},
        {"Title": [{"Language": "de", "Text": "Gesch\u00fctzte geologische Objekte"}],
        "Content": [{"Language": "de", "Text": "Die gesch\u00fctzten geologischen
        Objekte umfassen Naturdenkm\u00e4ler wie Findlinge, exotische Bl\u00f6cke,
        geologische Aufschl\u00fcsse, Gletscherm\u00fchlen und Mineralkl\u00fcfte.
        Jegliche Ver\u00e4nderung am Objekt ist ohne Bewilligung des Amts f\u00fcr
        Landwirtschaft und Natur verboten."}]}, {"Title": [{"Language": "de", "Text":
        "Gesetzliche Grundlage"}], "Content": [{"Language": "de", "Text": "Gesetz,
        Verordnung etc., das generell-abstrakt ist (generell f\u00fcr die Person,
        die nicht bekannt ist, abstrakt, weil der Perimeter ohne Karte definiert ist)
        und auf Bundesebene, auf kantonaler oder kommunaler Ebene erlassen worden
        ist und die bloss eine allgemeine Rechtsgrundlage der Eigentumsbeschr\u00e4nkung
        darstellen. Die gesetzliche Grundlage ist nicht Teil des \u00d6REB-Katasters.
        Der \u00d6REB-Kataster enth\u00e4lt aber Hinweise auf die entsprechende gesetzliche
        Grundlage."}]}, {"Title": [{"Language": "de", "Text": "Gesicherte \u00f6ffentliche
        Leitungen (Abwasserentsorgung, Wasserversorgung)"}], "Content": [{"Language":
        "de", "Text": "Eigent\u00fcmer von \u00f6ffentlichen Abwasser- und Wasserversorgungsleitungen
        haben die M\u00f6glichkeit, ihre Leitungen in einem \u00f6ffentlich-rechtlichen
        Verfahren mit einer \u00dcberbauungsordnung sichern zu lassen. Mit Genehmigung
        durch das Amt f\u00fcr Wasser und Abfall sind die betreffenden \u00f6ffentlichen
        Leitungen in ihrem Bestand gesch\u00fctzt."}]}, {"Title": [{"Language": "de",
        "Text": "Gew\u00e4sserraum"}], "Content": [{"Language": "de", "Text": "Fliessgew\u00e4sser
        k\u00f6nnen nur wieder naturn\u00e4her werden, wenn ausreichend Raum in den
        Schutz der Gew\u00e4sser miteinbezogen wird. Der Gew\u00e4sserraum soll weitgehend
        frei von neuen Anlagen bleiben; bestehende, rechtm\u00e4ssig erstellte Anlagen
        haben jedoch Bestandesgarantie."}]}, {"Title": [{"Language": "de", "Text":
        "Gew\u00e4sserschutzbereiche"}], "Content": [{"Language": "de", "Text": "Von
        den Kantonen zum Schutz des Grundwassers bezeichnete besonders gef\u00e4hrdete
        und \u00fcbrige Bereiche."}]}, {"Title": [{"Language": "de", "Text": "Grundwasserschutzareale"}],
        "Content": [{"Language": "de", "Text": "Von Kanton festgelegte Areale, die
        f\u00fcr die k\u00fcnftige Nutzung und Anreicherung von Grundwasservorkommen
        von Bedeutung sind und in dem keine Bauten und Anlagen erstellt oder Arbeiten
        ausgef\u00fchrt werden, die k\u00fcnftige Nutzungs- und Anreicherungsanlagen
        beeintr\u00e4chtigen k\u00f6nnten."}]}, {"Title": [{"Language": "de", "Text":
        "Grundwasserschutzzonen"}], "Content": [{"Language": "de", "Text": "Grundwasserschutzzonen,
        in denen gew\u00e4hrleistet werden soll, dass bei unmittelbar drohenden Gefahren
        wie Unf\u00e4llen mit wassergef\u00e4hrdenden Stoffen ausreichend Zeit und
        Raum f\u00fcr die erforderlichen Massnahmen zur Verf\u00fcgung stehen."}]},
        {"Title": [{"Language": "de", "Text": "Kantonale Denkmalschutzobjekte"}],
        "Content": [{"Language": "de", "Text": "Baudenkm\u00e4ler, an deren Sanierung
        Finanzhilfen des Kantons Bern ausgerichtet werden, werden grunds\u00e4tzlich
        unter den Schutz des Kantons Bern gestellt."}]}, {"Title": [{"Language": "de",
        "Text": "Kantonale Naturschutzgebiete"}], "Content": [{"Language": "de", "Text":
        "Schutzgebiete sind naturnahe, vielf\u00e4ltige oder spezielle Lebensr\u00e4ume,
        in denen besondere Vorschriften gelten. Im Schutzbeschluss sind die spezifischen
        Schutzziele f\u00fcr jedes Gebiet festgelegt."}]}, {"Title": [{"Language":
        "de", "Text": "Kataster der belasteten Standorte"}], "Content": [{"Language":
        "de", "Text": "Der Kataster enth\u00e4lt Deponien und andere durch Abf\u00e4lle
        belastete Standorte, die saniert werden, wenn sie zu sch\u00e4dlichen oder
        l\u00e4stigen Einwirkungen f\u00fchren oder die konkrete Gefahr besteht, dass
        solche Einwirkungen entstehen. Die Beh\u00f6rde ermittelt die belasteten Standorte,
        indem sie vorhandene Angaben wie Karten, Verzeichnisse und Meldungen auswertet.
        Sie tr\u00e4gt diejenigen Standorte, deren Belastung erwiesen oder sehr wahrscheinlich
        ist, in den Kataster ein."}]}, {"Title": [{"Language": "de", "Text": "Katasterverantwortliche
        Stelle"}], "Content": [{"Language": "de", "Text": "Die katasterverantwortliche
        Stelle im Kanton erh\u00e4lt die in den \u00d6REB-Kataster aufzunehmenden
        Daten von den zust\u00e4ndigen Fachstellen. Sie verwaltet diese Daten und
        stellt sie via kantonales \u00d6REB-Geoportal der \u00d6ffentlichkeit zur
        Verf\u00fcgung."}]}, {"Title": [{"Language": "de", "Text": "KbS"}], "Content":
        [{"Language": "de", "Text": "Kataster der belasteten Standorte"}]}, {"Title":
        [{"Language": "de", "Text": "L\u00e4rmempfindlichkeitsstufen"}], "Content":
        [{"Language": "de", "Text": "Empfindlichkeitsstufen werden festgelegt, um
        jeweils bestimmte Zonen zu definieren: diejenigen, die eines erh\u00f6hten
        L\u00e4rmschutzes bed\u00fcrfen, diejenigen, in denen keine st\u00f6renden
        Betriebe zugelassen sind, und diejenigen, in denen m\u00e4ssig und stark st\u00f6rende
        Betriebe zugelassen sind."}]}, {"Title": [{"Language": "de", "Text": "Mittelbare
        Eigentumsbeschr\u00e4nkungen"}], "Content": [{"Language": "de", "Text": "Mittelbar
        \u00f6ffentlich-rechtliche Eigentumsbeschr\u00e4nkungen k\u00f6nnen durch
        einen entsprechenden Verwaltungsakt in einer individuell-konkreten Verf\u00fcgung,
        einer generell-konkreten Allgemeinverf\u00fcgung oder gar einer generell-abstrakten
        Verwaltungsordnung konkretisiert werden und entfalten damit ihre Wirkung auf
        ein Grundst\u00fcck."}]}, {"Title": [{"Language": "de", "Text": "Naturgefahrenkarte"}],
        "Content": [{"Language": "de", "Text": "Gefahrenkarten zeigen, wo die Bev\u00f6lkerung
        und erhebliche Sachwerte durch Lawinen-, Sturz-, Rutsch- und Wassergefahren
        sowie Einsturz/Absenkung (inkl. Dolinen) bedroht sind. Die beh\u00f6rdenverbindlichen
        Gefahrenkarten werden laufend aktualisiert und von den Gemeinden innert zwei
        Jahren in die Ortsplanung miteinbezogen."}]}, {"Title": [{"Language": "de",
        "Text": "Nutzungsplanung"}], "Content": [{"Language": "de", "Text": "Festlegung
        der Verwendung einzelner Bodenfl\u00e4chen f\u00fcr bestimmte Zwecke (z. B.
        Landwirtschaft, Siedlung, Wald)."}]}, {"Title": [{"Language": "de", "Text":
        "\u00d6REB"}], "Content": [{"Language": "de", "Text": "\u00d6ffentlich-rechtliche
        Eigentumsbeschr\u00e4nkung"}]}, {"Title": [{"Language": "de", "Text": "\u00d6REB-Kataster"}],
        "Content": [{"Language": "de", "Text": "Kataster der \u00f6ffentlich-rechtlichen
        Eigentumsbeschr\u00e4nkungen"}]}, {"Title": [{"Language": "de", "Text": "Planungszonen"}],
        "Content": [{"Language": "de", "Text": "Zone, die ein genau bezeichnetes Gebiet
        umfasst, f\u00fcr das ein Nutzungsplan angepasst werden muss oder noch keiner
        vorliegt, und innerhalb derer nichts unternommen werden darf, was die Nutzungsplanung
        erschwert."}]}, {"Title": [{"Language": "de", "Text": "Projektierungszonen
        Eisenbahnanlagen"}], "Content": [{"Language": "de", "Text": "Um die freie
        Verf\u00fcgbarkeit der f\u00fcr k\u00fcnftige Bahnbauten und -anlagen erforderlichen
        Grundst\u00fccke zu gew\u00e4hrleisten, k\u00f6nnen f\u00fcr genau bezeichnete
        Gebiete Projektierungszonen festgelegt werden. In diesen Zonen d\u00fcrfen
        keine baulichen Ver\u00e4nderungen vorgenommen werden, die dem Zweck der Eisenbahnen
        widersprechen."}]}, {"Title": [{"Language": "de", "Text": "Projektierungszonen
        Flughafenanlagen"}], "Content": [{"Language": "de", "Text": "Um die freie
        Verf\u00fcgbarkeit der f\u00fcr Flughafenanlagen erforderlichen Grundst\u00fccke
        zu gew\u00e4hrleisten, k\u00f6nnen f\u00fcr genau bezeichnete Gebiete Projektierungszonen
        festgelegt werden. In diesen Zonen d\u00fcrfen keine baulichen Ver\u00e4nderungen
        vorgenommen werden, die dem Zweck der Flughafenanlagen widersprechen."}]},
        {"Title": [{"Language": "de", "Text": "Projektierungszonen Leitungen mit einer
        Nennspannung von 220 kV oder h\u00f6her"}], "Content": [{"Language": "de",
        "Text": "Um die freie Verf\u00fcgbarkeit der f\u00fcr Leitungen mit einer
        Nennspannung von 220 kV oder h\u00f6her erforderlichen Grundst\u00fccke zu
        gew\u00e4hrleisten, k\u00f6nnen f\u00fcr genau bezeichnete Gebiete Projektierungszonen
        festgelegt werden. In diesen Zonen d\u00fcrfen keine baulichen Ver\u00e4nderungen
        vorgenommen werden, die dem Zweck der Flughafenanlagen widersprechen."}]},
        {"Title": [{"Language": "de", "Text": "Projektierungszonen Nationalstrassen"}],
        "Content": [{"Language": "de", "Text": "Um die freie Verf\u00fcgbarkeit des
        f\u00fcr den Bau der Nationalstrassen erforderlichen Landes zu gew\u00e4hrleisten,
        k\u00f6nnen f\u00fcr genau bezeichnete Gebiete Projektierungszonen festgelegt
        werden. In diesen Zonen d\u00fcrfen keine baulichen Ver\u00e4nderungen vorgenommen
        werden, die dem Zweck der Nationalstrassen widersprechen."}]}, {"Title": [{"Language":
        "de", "Text": "Rechtsvorschrift"}], "Content": [{"Language": "de", "Text":
        "Generell-konkrete Rechtsnorm, die zusammen mit den ihr zugeschriebenen Geobasisdaten
        die Eigentumsbeschr\u00e4nkung unmittelbar umschreibt und innerhalb desselben
        Verfahrens verabschiedet worden ist."}]}, {"Title": [{"Language": "de", "Text":
        "Sachplan Biodiversit\u00e4t"}], "Content": [{"Language": "de", "Text": "Der
        Sachplan Biodiversit\u00e4t legt Massnahmen fest, um die Artenvielfalt von
        Fauna und Flora zu verbessern und Defizite bei der Umsetzung der Bundesinventare
        zu verringern. Er definiert die Perimeter der Hochmoore, Flachmoore, Trockenwiesen
        und -weiden, Auen, Amphibienlaichgebiete und Wildwechselkorridore und ist
        f\u00fcr Beh\u00f6rden verbindlich."}]}, {"Title": [{"Language": "de", "Text":
        "Sicherheitszonenplan"}], "Content": [{"Language": "de", "Text": "Zonenplan,
        in dem die Sicherheitszonen dargestellt sind und aus dem die Eigentumsbeschr\u00e4nkungen
        nach Fl\u00e4che und H\u00f6he ersichtlich sind."}]}, {"Title": [{"Language":
        "de", "Text": "Statische Waldgrenzen"}], "Content": [{"Language": "de", "Text":
        "Statische Waldgrenzen m\u00fcssen auf der Grundlage rechtskr\u00e4ftiger
        Waldfeststellungen festgelegt werden. Neue Bestockungen ausserhalb dieser
        Waldgrenzen gelten nicht als Wald."}]}, {"Title": [{"Language": "de", "Text":
        "Unmittelbare Eigentumsbeschr\u00e4nkungen"}], "Content": [{"Language": "de",
        "Text": "Unmittelbar \u00f6ffentlich-rechtliche Eigentumsbeschr\u00e4nkungen
        sind Nutzungs- und Verf\u00fcgungsbeschr\u00e4nkungen, die sofort auf ein
        Grundst\u00fcck wirken. Sie st\u00fctzen sich auf entsprechende Gesetze und
        Verordnungen, so dass ein weiterer beh\u00f6rdlicher Vollzug (Begr\u00fcndungsakt,
        rechtsbegr\u00fcndeten Eintrag im Grundbuch, usw.) nicht n\u00f6tig ist."}]},
        {"Title": [{"Language": "de", "Text": "Vorwirkung"}], "Content": [{"Language":
        "de", "Text": "Mit der \u00f6ffentlichen Auflage entsteht eine Vorwirkung:
        Ab diesem Zeitpunkt d\u00fcrfen Bauvorhaben in der Regel nur bewilligt werden,
        wenn sie der \u00f6ffentlich aufgelegten Planung nicht widersprechen."}]},
        {"Title": [{"Language": "de", "Text": "Waldabstandslinien"}], "Content": [{"Language":
        "de", "Text": "Waldabstandslinien werden im Kanton Bern gem\u00e4ss der kantonalen
        Fachgesetzgebung als Wald-Baulinien bezeichnet. Sie werden im Rahmen eines
        Nutzungsplanungsverfahrens erlassen und k\u00f6nnen auch gemeindespezifische
        Bezeichnungen aufweisen (z.B. reduzierter Waldabstand). Bauten und Anlagen
        in Waldesn\u00e4he sind nur zul\u00e4ssig, wenn sie die Erhaltung, Pflege
        und Nutzung des Waldes nicht beeintr\u00e4chtigen."}]}, {"Title": [{"Language":
        "de", "Text": "Waldreservate"}], "Content": [{"Language": "de", "Text": "Gesch\u00fctzte
        Waldfl\u00e4che, die der Erhaltung der Artenvielfalt von Fauna und Flora dient."}]},
        {"Title": [{"Language": "de", "Text": "Wasserbauplan, \u00dcberflutungsgebiet"}],
        "Content": [{"Language": "de", "Text": "Bestehende Bauten und Anlagen in \u00dcberflutungsgebieten
        sind durch Objektschutzmassnahmen zu sch\u00fctzen. Daneben k\u00f6nnen im
        \u00dcberflutungsgebiet Bauverbote, Auflagen und Nutzungseinschr\u00e4nkungen
        erlassen werden. Eigent\u00fcmer und Eigent\u00fcmerinnen der Parzellen in
        \u00dcberflutungsgebieten haben Anspruch auf eine angemessene Entsch\u00e4digung."}]},
        {"Title": [{"Language": "de", "Text": "Zusatzinformation"}], "Content": [{"Language":
        "de", "Text": "Zusatzinformationen sind gem\u00e4ss Artikel 8b \u00d6REBKV
        unverbindliche Informationen (\u00c4nderungen an \u00d6REB, weitere Geobasisdaten,
        Hinweise) und nicht Bestandteil des rechtskr\u00e4ftigen Inhaltes des \u00d6REB-Katasters.
        Sie k\u00f6nnen unmittelbare und mittelbare, also potenzielle Eigentumsbeschr\u00e4nkungen
        sein, welche in entsprechenden beh\u00f6rdlichen Verfahren ber\u00fccksichtigt
        werden und zu entsprechenden Eigentumsbeschr\u00e4nkungen f\u00fchren k\u00f6nnen."}]},
        {"Title": [{"Language": "de", "Text": "Zust\u00e4ndige Stelle"}], "Content":
        [{"Language": "de", "Text": "Durch die Gesetzgebung bezeichnete Stelle des
        Bundes, des Kantons oder der Gemeinde, die f\u00fcr das Erheben, Nachf\u00fchren
        und Verwalten der Geobasisdaten zust\u00e4ndig ist."}]}]}}}'
