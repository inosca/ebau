# WARNING: Deprecated!
# Those forms got moved to `workflow-preliminary-clarification` as v3.
# This workflow remains only as a historical record, since we won't
# migrate existing cases to the new workflow.

mutation CreateInternalWorkflow {
  saveWorkflow(
    input: {
      slug: "internal"
      name: "Internes Verfahren"
      startTasks: ["submit"]
      allowForms: [
        "baupolizeiliches-verfahren"
        "baupolizeiliches-verfahren-v2"
        "zutrittsermaechtigung"
        "zutrittsermaechtigung-v2"
      ]
      isPublished: true
    }
  ) {
    clientMutationId
  }
}

mutation CreateFlow {
  addWorkflowFlow(
    input: {
      workflow: "internal"
      tasks: ["submit"]
      next: "['ebau-number', 'audit', 'init-additional-demand', 'decision', 'create-manual-workitems']|tasks"
    }
  ) {
    clientMutationId
  }
}
