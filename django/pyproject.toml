[tool.ruff]

exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "camac/*/migrations",
    "camac/ech0211/schema",
    ".*/snapshots",
]

lint.ignore = [
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D106", # Missing docstring in public nested class
    "D107", # Missing docstring in __init__
    "E501", # Line too long (92 > 88)
    "D202", # No blank lines allowed after function docstring
    "D212", # Multi-line docstring summary should start at the first line
    "D213", # Multi-line docstring summary should start at the second line
    "D407", # Missing dashed underline after section
    "D406", # Section name should end with a newline
    "D203", # one-blank-line-before-class (docstring)
    "D413", # Missing blank line after last section
    "D417", # Missing argument descriptions in the docstring
]

line-length = 88


lint.select = ["C9", "D", "E", "F", "W", "I"]

[tool.ruff.lint.mccabe]
max-complexity = 11

[tool.ruff.lint.isort]
combine-as-imports = true

known-first-party = ["camac"]
known-third-party = [
    "django",
    "keycloak",
    "pyxb",
    "drf_yasg",
    "pyproj",
    "xmlschema",
    "oauthlib",
    "requests_oauthlib",
    "caluma",
    "jwt",
]

[tool.whichtest]

exempt = [
    '.*/urls\.py',
    '.*/test_.*\.py',
    '.*/conftest\.py',
    '^camac/settings/.*',
]

[tool.pytest.ini_options]
addopts = "--no-migrations --reuse-db --randomly-seed=1521188766 --randomly-dont-reorganize"
DJANGO_SETTINGS_MODULE = "camac.settings"
env = [
    "DJANGO_CACHE_BACKEND=django.core.cache.backends.locmem.LocMemCache",
    "APPLICATION=test",
    "APPLICATION_ENV=ci",
    "TEST_SUITE_RUNNING=true",
    "DJANGO_Q_ENABLE_SYNC=false",
]
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "error::RuntimeWarning",
    # Caused by automatically generated empty fixtures
    "ignore:No fixture data:RuntimeWarning",
    # Caused by whitenoise in tests
    "ignore:No directory at:UserWarning",
    # Caused by multiple tests using the same test files
    "ignore:Duplicate name:UserWarning",
    # Issue in pytest-factoryboy
    "ignore:.*_after_postgeneration will stop saving the instance.*:DeprecationWarning",
    # https://github.com/lidatong/dataclasses-json/pull/351
    "ignore:The 'default' argument to fields is deprecated. Use 'dump_default' instead.",
    "ignore:`Field` should not be instantiated.:marshmallow.warnings.ChangedInMarshmallow4Warning",
    "ignore:jsonschema.RefResolver is deprecated.*",
    "ignore:Unknown type .* It's advised to pass the correct marshmallow type to `mm_field`.:UserWarning",
]

[tool.coverage.run]
source = ["."]

dynamic_context = "test_function"


[tool.coverage.report]
fail_under = 100
skip_empty = true
skip_covered = true

exclude_lines = [
    "pragma: no cover",
    "pragma: todo cover",
    "def __str__",
    "def __unicode__",
    "def __repr__",
]
exclude_also = ["\\A(?s:.*# pragma: exclude file.*)\\Z"]
