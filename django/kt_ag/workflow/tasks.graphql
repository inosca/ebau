    input: {
      slug: "create-manual-workitems"
      name: "Manuelle Aufgaben erfassen"
      addressGroups: "[]"
      isMultipleInstance: true
      meta: "{\"is-manually-completable\":true}"
    }
  ) {
    clientMutationId
  }
}

