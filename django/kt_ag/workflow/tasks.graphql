mutation CreateSubmitTask {
  saveCompleteWorkflowFormTask(
    input: {
      slug: "submit"
      name: "Gesuch einreichen"
      addressGroups: "[\"applicant\"]"
    }
  ) {
    clientMutationId
  }
}

