}

mutation CreateFlowAfterDecision {
  addWorkflowFlow(
    input: {
      workflow: "building-permit"
      tasks: ["decision"]
      next: "[]|tasks"
      redoable: "'distribution'|task"
    }
  ) {
    clientMutationId
  }
}
