mutation CreateBuildingPermitWorkflow {
  saveWorkflow(
    input: {
      slug: "building-permit"
      name: "Baugesuch"
      startTasks: ["submit"]
      allowForms: [
        "anfrage"
        "anfrage-intern"
        "baugesuch"
        "baugesuch-mit-uvp"
        "plangenehmigungsverfahren-bund"
        "plangenehmigungsverfahren-gas"
        "reklame"
        "vorentscheid"
      ]
      isPublished: true
    }
  ) {
    clientMutationId
  }
}

mutation CreateFlowAfterSubmit {
  addWorkflowFlow(
    input: {
      workflow: "building-permit"
      tasks: ["submit"]
      next: "[\"create-manual-workitems\", \"formal-exam\", \"init-additional-demand\"]|tasks"
    }
  ) {
    clientMutationId
  }
}

mutation CreateFlowAfterFormalExam {
  addWorkflowFlow(
    input: {
      workflow: "building-permit"
      tasks: ["formal-exam"]
      next: "[\"distribution\", \"cantonal-exam\", \"maybe-publication\", \"objections\"]|tasks"
    }
  ) {
    clientMutationId
  }
}

mutation CreateFlowAfterFillPublication {
