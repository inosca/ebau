; Runs one celery worker per queue inside a single container so the queues get
; independent concurrency and can't block each other. Used by the `celery
; --isolated` entrypoint command. Supervisord keeps each worker alive
; (autorestart) and forwards a warm shutdown on SIGTERM.
;
; Per-queue concurrency comes from the env vars
; `CELERY_CONCURRENCY_{DEFAULT,IMPORT,TIKA}_QUEUE`, which `entrypoint.sh`
; exports with defaults and any deployment can override. It is passed to each
; worker as `CELERY_WORKER_CONCURRENCY` (which the Django settings require for
; worker processes).
;
; To add a queue: add a `[program:celery-<queue>]` block here, export its
; concurrency default in `entrypoint.sh`, and add a route in
; `CELERY_TASK_ROUTES`.

[supervisord]
nodaemon=true
logfile=/dev/fd/1
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:celery-default]
command=celery -A camac worker -l INFO -E -O fair -Q celery -n default@%%h
environment=
    CELERY_WORKER_CONCURRENCY="%(ENV_CELERY_CONCURRENCY_DEFAULT_QUEUE)s",
    CELERY_DEBUGPY_PORT="5679",
    CELERY_QUEUE_LABEL="default"
directory=/app
autorestart=true
startretries=3
stopsignal=TERM
stopwaitsecs=60
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:celery-import]
command=celery -A camac worker -l INFO -E -O fair -Q import -n import@%%h
environment=
    CELERY_WORKER_CONCURRENCY="%(ENV_CELERY_CONCURRENCY_IMPORT_QUEUE)s",
    CELERY_DEBUGPY_PORT="5680",
    CELERY_QUEUE_LABEL="import"
directory=/app
autorestart=true
startretries=3
stopsignal=TERM
stopwaitsecs=60
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:celery-tika]
command=celery -A camac worker -l INFO -E -O fair -Q tika -n tika@%%h
environment=
    CELERY_WORKER_CONCURRENCY="%(ENV_CELERY_CONCURRENCY_TIKA_QUEUE)s",
    CELERY_DEBUGPY_PORT="5681",
    CELERY_QUEUE_LABEL="tika"
directory=/app
autorestart=true
startretries=3
stopsignal=TERM
stopwaitsecs=60
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:celery-beat]
command=celery -A camac beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
autostart=%(ENV_CELERY_ENABLE_BEAT)s
directory=/app
autorestart=true
startretries=3
stopsignal=TERM
stopwaitsecs=60
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
