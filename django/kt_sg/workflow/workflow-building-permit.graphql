mutation CreateBuildingPermitWorkflow {
  saveWorkflow(
    input: {
      slug: "building-permit"
      name: "Baugesuch"
      startTasks: ["submit"]
      allowForms: ["baugesuch"]
      isPublished: true
    }
  ) {
    clientMutationId
  }
}

mutation CreateFlowAfterSubmit {
  addWorkflowFlow(
    input: {
      workflow: "building-permit"
      tasks: ["submit"]
      next: "['formal-exam', 'material-exam', 'init-additional-demand', 'create-manual-workitems']|tasks"
    }
  ) {
    clientMutationId
  }
}

mutation CreateFlowAfterFormalExam {
  addWorkflowFlow(
    input: {
      workflow: "building-permit"
      tasks: ["formal-exam"]
      next: "['maybe-publication', 'distribution']|tasks"
    }
  ) {
    clientMutationId
  }
}

mutation CreateFlowAfterDistribution {
  addWorkflowFlow(
    input: {
      workflow: "building-permit"
      tasks: ["distribution"]
      next: "[]|tasks"
    }
  ) {
    clientMutationId
  }
}

mutation CreateFlowAfterFillPublication {
  addWorkflowFlow(
    input: {
      workflow: "building-permit"
      tasks: ["fill-publication"]
      next: "[\"create-publication\"]|tasks"
    }
  ) {
    clientMutationId
  }
}

mutation CreateFlowAfterCreatePublication {
  addWorkflowFlow(
    input: {
      workflow: "building-permit"
      tasks: ["create-publication"]
      next: "[\"fill-publication\"]|tasks"
    }
  ) {
    clientMutationId
  }
}
