include:
  - path: services/elixir.yml

services:
  django:
    image: acr.run/camac-ng/camac-ng/django:${CI_COMMIT_TAG:-main}
    build:
      context: ../django
      cache_from:
        - acr.run/camac-ng/camac-ng/django:${CI_COMMIT_TAG:-main}
      args:
        APPLICATION: ${APPLICATION}

  ember-caluma-portal:
    image: acr.run/camac-ng/camac-ng/ember-caluma-portal:${CI_COMMIT_TAG:-main}
    build:
      context: ../
      dockerfile: ./Dockerfile.ember
      cache_from:
        - acr.run/camac-ng/camac-ng/ember-caluma-portal:${CI_COMMIT_TAG:-main}
      target: prod-env
      args:
        APPLICATION: ${APPLICATION}
        KEYCLOAK_HOST: $${KEYCLOAK_HOST}
        KEYCLOAK_REALM: $${KEYCLOAK_REALM}
        KEYCLOAK_BASE_PATH: $${KEYCLOAK_BASE_PATH}
        KEYCLOAK_CLIENT: $${KEYCLOAK_CLIENT}
        KEYCLOAK_SCOPES: $${KEYCLOAK_SCOPES}
        INTERNAL_URL: $${INTERNAL_URL}
        ENABLE_WATERMARK: $${ENABLE_WATERMARK}
        WATERMARK: $${WATERMARK}
        REPLACE_ENV: KEYCLOAK_HOST,KEYCLOAK_REALM,KEYCLOAK_BASE_PATH,KEYCLOAK_CLIENT,KEYCLOAK_SCOPES,INTERNAL_URL,ENABLE_WATERMARK,WATERMARK
        WORKSPACE: ember-caluma-portal

  ember-ebau:
    image: acr.run/camac-ng/camac-ng/ember-ebau:${CI_COMMIT_TAG:-main}
    build:
      context: ../
      dockerfile: ./Dockerfile.ember
      cache_from:
        - acr.run/camac-ng/camac-ng/ember-ebau:${CI_COMMIT_TAG:-main}
      target: prod-env
      args:
        APPLICATION: ${APPLICATION}
        KEYCLOAK_HOST: $${KEYCLOAK_HOST}
        KEYCLOAK_REALM: $${KEYCLOAK_REALM}
        KEYCLOAK_BASE_PATH: $${KEYCLOAK_BASE_PATH}
        KEYCLOAK_CLIENT: $${KEYCLOAK_CLIENT}
        KEYCLOAK_SCOPES: $${KEYCLOAK_SCOPES}
        PORTAL_URL: $${PORTAL_URL}
        ENABLE_WATERMARK: $${ENABLE_WATERMARK}
        WATERMARK: $${WATERMARK}
        REPLACE_ENV: KEYCLOAK_HOST,KEYCLOAK_REALM,KEYCLOAK_BASE_PATH,KEYCLOAK_CLIENT,KEYCLOAK_SCOPES,PORTAL_URL,ENABLE_WATERMARK,WATERMARK
        WORKSPACE: ember-ebau

  keycloak:
    image: acr.run/camac-ng/camac-ng/keycloak:${CI_COMMIT_TAG:-main}
    build:
      context: ../keycloak
      args:
        VERSION: 26.7
      cache_from:
        - acr.run/camac-ng/camac-ng/keycloak:${CI_COMMIT_TAG:-main}

  document-merge-service:
    image: acr.run/camac-ng/camac-ng/document-merge-service:${CI_COMMIT_TAG:-main}
    build:
      context: ../document-merge-service
      cache_from:
        - acr.run/camac-ng/camac-ng/document-merge-service:${CI_COMMIT_TAG:-main}
      args:
        DMS_VERSION: 10.0
        APPLICATION: ${APPLICATION}

  garage:
    image: acr.run/camac-ng/camac-ng/garage:${CI_COMMIT_TAG:-main}
    build:
      context: ../garage
      cache_from:
        - acr.run/camac-ng/camac-ng/garage:${CI_COMMIT_TAG:-main}

  gotenberg:
    image: acr.run/camac-ng/camac-ng/gotenberg:${CI_COMMIT_TAG:-main}
    build:
      context: ../gotenberg
      cache_from:
        - acr.run/camac-ng/camac-ng/gotenberg:${CI_COMMIT_TAG:-main}
