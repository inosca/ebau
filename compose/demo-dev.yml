services:
  cache:
    ports:
      - "11211:11211"
    networks:
      - ebau.localhost

  proxy:
    volumes:
      - ../proxy/demo.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    networks:
      ebau.localhost:
        aliases:
          - ember-ebau.localhost
          - ebau-portal.localhost
          - ebau-rest-portal.localhost
          - ebau-keycloak.localhost

  db:
    # Workaround, same name of image as cache_from
    # better be named differently once following is fixed:
    # https://github.com/docker/compose/issues/5458
    # see also other services below
    image: acr.run/camac-ng/camac-ng/db:master
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=camac
    volumes:
      - ../db/init-user-db.sh:/docker-entrypoint-initdb.d/init-user-db.sh:ro
    networks:
      - ebau.localhost

  django: &django
    image: acr.run/camac-ng/camac-ng/django:master
    build:
      args:
        REQUIREMENTS: requirements-dev.txt
    ports:
      - "5555:5555"
      - "5678:5678"
    volumes:
      - ../django:/app
      - /app/staticfiles # prevent staticfiles from leaking to the host system
    environment:
      - ENV=development
      - APPLICATION_ENV=development
      - KEYCLOAK_URL=http://ebau-keycloak.localhost/auth/
      - DATABASE_PASSWORD=camac
      - DATABASE_USER=camac
      - DJANGO_EMAIL_HOST=mailpit
      - DJANGO_EMAIL_PORT=1025
      - OAUTHLIB_INSECURE_TRANSPORT=1
      - OIDC_USERINFO_ENDPOINT=http://ebau-keycloak.localhost/auth/realms/ebau/protocol/openid-connect/userinfo
      - PYTHONDONTWRITEBYTECODE=1
      - GWR_FERNET_KEY=GUdwT6yKxqfszrnHC7wyKDmtVZdhjSVQEPnpeJYNLf8=
    networks:
      - ebau.localhost
    tty: true
    stdin_open: true
    command: devserver

  ember-caluma-portal:
    image: acr.run/camac-ng/camac-ng/ember-caluma-portal:master
    environment:
      - BE_GIS_URL=https://www.map2-test.apps.be.ch
    networks:
      - ebau.localhost

  ember-ebau:
    image: acr.run/camac-ng/camac-ng/ember-ebau:master
    networks:
      - ebau.localhost

  keycloak:
    volumes:
      - ../keycloak/config/${APPLICATION}-test-config.json:/opt/keycloak/data/import/test-config.json
    environment:
      - KC_DB_PASSWORD=camac
      - KC_DB_URL=jdbc:postgresql://db:5432/${APPLICATION}?currentSchema=keycloak
      - KC_DB_USERNAME=camac
      - KC_HOSTNAME=ebau-keycloak.localhost
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=camac
    networks:
      - ebau.localhost

  mailpit:
    networks:
      - ebau.localhost
    environment:
      - MP_WEBROOT=mailpit

  document-merge-service:
    networks:
      - ebau.localhost
    environment:
      - ENV=dev
      - OIDC_USERINFO_ENDPOINT=http://ebau-keycloak.localhost/auth/realms/ebau/protocol/openid-connect/userinfo
      - OIDC_GROUPS_API=http://ebau.localhost/api/v1/me?include=service,service.service_parent
    # There appears to be bug where libreoffice can only be started as the root
    # user. The workaround of fixing owner and permissions of ~/.config did not
    # work in our case.
    #
    # https://github.com/unoconv/unoconv/issues/241#issuecomment-549434601
    # https://superuser.com/questions/564534/only-root-user-is-able-to-open-libreoffice
    # user: "${UID:?Set UID env variable to your user id}"

  alexandria:
    ports:
      - "8000:8000"
    depends_on:
      - db
      - garage
    environment:
      - DATABASE_PASSWORD=camac
      - ALLOWED_HOSTS=*
      - OIDC_OP_USER_ENDPOINT=http://ebau-keycloak.localhost/auth/realms/ebau/protocol/openid-connect/userinfo
    networks:
      - ebau.localhost

  garage:
    build:
      context: ../garage
    volumes:
      - garage_meta:/var/lib/garage/meta/
      - garage_data:/var/lib/garage/data/
    env_file:
      - ../garage/compose-env/dev-garage.conf
    networks:
      - ebau.localhost

  garage-webui:
    image: khairul169/garage-webui:latest
    restart: unless-stopped
    volumes:
      - ../garage/garage.toml:/etc/garage.toml:ro
    ports:
      - 3909:3909
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
    networks:
      - ebau.localhost
    depends_on:
      - garage


networks:
  ebau.localhost:
  garage_meta:
    driver: local
  garage_data:
    driver: local
