services:
  cache:
    ports:
      - "11211:11211"
    networks:
      - ebau.localhost

  proxy:
    volumes:
      - ../proxy/kt_gr.conf:/etc/nginx/conf.d/default.conf.in:ro
      - ../proxy/csp_headers.inc:/etc/nginx/conf.d/csp_headers.inc:ro
      - ../proxy/docker-entrypoint.d/90-nameserver.sh:/docker-entrypoint.d/90-nameserver.sh:ro
      - djangomedia:/var/lib/camac/media:ro
      - djangotmpmedia:/tmp/camac/tmpfiles:ro
    depends_on:
      - ember-caluma-portal
      - django
      - keycloak
      - mailpit
      - document-merge-service
      - ember-ebau
      - minio
    ports:
      - "80:80"
    networks:
      ebau.localhost:
        aliases:
          - ember-ebau.localhost
          - ebau-portal.localhost
          - ebau-rest-portal.localhost
          - ebau-keycloak.localhost

  db:
    image: postgres:15-bullseye
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=camac
      - POSTGRES_PASSWORD=camac
      - POSTGRES_DATABASE=${APPLICATION}
    volumes:
      - ../db/init-user-db.sh:/docker-entrypoint-initdb.d/init-user-db.sh:ro
      - pg15data:/var/lib/postgresql/data
    networks:
      - ebau.localhost

  django: &django
    image: acr.run/camac-ng/camac-ng/django:master
    depends_on:
      - db
      - minio
    build:
      args:
        REQUIREMENTS: requirements-dev.txt
    ports:
      - "5555:5555"
      - "5678:5678"
    volumes:
      - ../django:/app
      - djangomedia:/var/lib/camac/media
      - djangotmpmedia:/tmp/camac/tmpfiles
      - /app/staticfiles # prevent staticfiles from leaking to the host system
    environment:
      - APPLICATION_ENV=development
      - ENV=development # used in caluma and alexandria settings
      - KEYCLOAK_URL=http://ebau-keycloak.localhost/auth/
      - DATABASE_PASSWORD=camac
      - DATABASE_USER=camac
      - DJANGO_EMAIL_HOST=mailpit
      - DJANGO_EMAIL_PORT=1025
      - OAUTHLIB_INSECURE_TRANSPORT=1
      - OIDC_USERINFO_ENDPOINT=http://ebau-keycloak.localhost/auth/realms/ebau/protocol/openid-connect/userinfo
      - PYTHONDONTWRITEBYTECODE=1
      - DJANGO_INTERNAL_BASE_URL=http://ember-ebau.localhost
      - DOCUMENT_MERGE_SERVICE_URL=http://document-merge-service:8000/document-merge-service/api/v1/
      - CONSTRUCTION_MONITORING_ENABLED=true
      - DEADLINES_ENABLED=true
      # Alexandria
      - TIKA_CLIENT_ONLY=true
      - TIKA_SERVER_ENDPOINT=http://tika:9998
      # GWR
      - GWR_FERNET_KEY=GUdwT6yKxqfszrnHC7wyKDmtVZdhjSVQEPnpeJYNLf8=
      - GWR_HOUSING_STAT_BASE_URI=https://www-r.housing-stat.ch/regbl/api/ech0216/2
      # GIS
      - GR_GIS_BASE_URL=https://wps-test.geo.gr.ch
      # celery
      - CELERY_RDB_HOST=0.0.0.0. # to be able to telnet from outside the container
      - CELERY_WORKER_CONCURRENCY=1
      - PYTHONUNBUFFERED=1
      - FORMAT_VALIDATOR_CLASSES=camac.caluma.extensions.format_validators.EEBADeclarationFormatValidator,camac.caluma.extensions.format_validators.DateAfterValidator
    networks:
      - ebau.localhost
    tty: true
    stdin_open: true
    command: devserver

  dummy-eeba:
    networks:
      - ebau.localhost
    build:
      context: ../dummy-eeba-server
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    volumes:
      - ../dummy-eeba-server:/app

  ember-caluma-portal:
    image: acr.run/camac-ng/camac-ng/ember-caluma-portal:master
    build:
      args:
        - ENABLE_WATERMARK=true
    networks:
      - ebau.localhost

  ember-ebau:
    image: acr.run/camac-ng/camac-ng/ember-ebau:master
    build:
      args:
        - ENABLE_WATERMARK=true
    networks:
      - ebau.localhost

  keycloak:
    image: acr.run/camac-ng/camac-ng/keycloak-${APPLICATION}:master
    depends_on:
      - db
    volumes:
      - ../keycloak/config/${APPLICATION}-test-config.json:/opt/keycloak/data/import/test-config.json
      - ../keycloak/themes/src/main/resources/theme/kanton-gr:/opt/keycloak/themes/kanton-gr-dev
    environment:
      - KC_DB_PASSWORD=camac
      - KC_DB_URL=jdbc:postgresql://db:5432/${APPLICATION}?currentSchema=keycloak
      - KC_DB_USERNAME=camac
      - KC_HOSTNAME=ebau-keycloak.localhost
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=camac
      - KC_SPI_OAUTH2_TOKEN_EXCHANGE_DEFAULT_PROVIDER=standard
      - KC_SPI_OAUTH2_TOKEN_EXCHANGE_EBAU_ENABLED=false
    networks:
      - ebau.localhost
    command:
      [
        "start",
        "--spi-theme-static-max-age=-1",
        "--spi-theme-cache-themes=false",
        "--spi-theme-cache-templates=false",
      ]

  mailpit:
    networks:
      - ebau.localhost
    environment:
      - MP_WEBROOT=mailpit

  document-merge-service:
    image: acr.run/camac-ng/camac-ng/document-merge-service:master
    depends_on:
      - db
    networks:
      - ebau.localhost
    cap_add:
      - CAP_SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      - ENV=dev
      - ISOLATE_UNOCONV=true
      - OIDC_USERINFO_ENDPOINT=http://ebau-keycloak.localhost/auth/realms/ebau/protocol/openid-connect/userinfo
      - DATABASE_HOST=db
      - DATABASE_NAME=${APPLICATION}
      - DATABASE_USER=camac
      - DATABASE_PASSWORD=camac
      - URL_PREFIX=document-merge-service/
      - EXTENSIONS_ARGUMENTS=DJANGO_API=http://django
      - DMS_S3_ACCESS_KEY_ID=minio
      - DMS_S3_SECRET_ACCESS_KEY=minio123
      - DMS_S3_ENDPOINT_URL=http://minio:9000
    user: "${UID:?Set UID env variable to your user id}"
    volumes:
      - ../document-merge-service/extensions:/app/document_merge_service/extensions
      - ../document-merge-service/${APPLICATION}/dump.json:/tmp/document-merge-service/dump.json
    command: devserver

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
      - MINIO_BROWSER_REDIRECT_URL=http://ember-ebau.localhost/minio/ui
    command: server data --console-address ":9090"
    networks:
      - ebau.localhost

  mc:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    restart: on-failure
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
    volumes:
      - ../mc/entrypoint.sh:/entrypoint.sh
      - ../document-merge-service/${APPLICATION}/templatefiles:/tmp/dms-media
    entrypoint: /entrypoint.sh
    depends_on:
      - minio
    networks:
      - ebau.localhost

  clamav:
    profiles:
      - full
    ports:
      - "3310:3310"
    environment:
      - ENABLE_DEFINITIONS_UPDATE=false
    networks:
      - ebau.localhost

  tika:
    networks:
      - ebau.localhost

  redis:
    networks:
      - ebau.localhost
    environment:
      - REDIS_PASSWORD=redis

  celery:
    <<: *django
    command: celerydev
    ports:
      - "6900-7000:6900-7000"

  celery-beat:
    <<: *django
    ports: []
    command: celery-beat-dev

networks:
  ebau.localhost:

volumes:
  minio_data:
    driver: local
  templatefiles:
