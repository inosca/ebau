services:
  cache:
    ports:
      - "11211:11211"
    networks:
      - ebau.localhost

  proxy:
    volumes:
      - ../proxy/kt_uri.conf:/etc/nginx/conf.d/default.conf.in:ro
      - ../proxy/csp_headers.inc:/etc/nginx/conf.d/csp_headers.inc:ro
      - ../proxy/csp_headers_default.inc:/etc/nginx/conf.d/csp_headers_default.inc:ro
      - ../proxy/docker-entrypoint.d/90-nameserver.sh:/docker-entrypoint.d/90-nameserver.sh:ro
    depends_on:
      - mailpit
      - garage
    ports:
      - "80:80"
    networks:
      ebau.localhost:
        aliases:
          - ebau.localhost
          - ebau-portal.localhost
          - ebau-rest-portal.localhost
          - ebau-keycloak.localhost
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ember-camac-ng:
    image: acr.run/camac-ng/camac-ng/ember-camac-ng:master
    networks:
      - ebau.localhost

  clamav:
    profiles:
      - full
    ports:
      - "3310:3310"
    environment:
      - ENABLE_DEFINITIONS_UPDATE=false
    networks:
      - ebau.localhost

  db:
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=camac
    volumes:
      - ../db/init-user-db.sh:/docker-entrypoint-initdb.d/init-user-db.sh:ro
      - pg15data:/var/lib/postgresql/data
    networks:
      - ebau.localhost

  django: &django
    image: acr.run/camac-ng/camac-ng/django:master
    build:
      args:
        REQUIREMENTS: requirements-dev.txt
    depends_on:
      - mailpit
      - garage
    ports:
      - "5555:5555"
      - "5678:5678"
    volumes:
      - ../django:/app
      - /app/staticfiles # prevent staticfiles from leaking to the host system
    environment:
      ENV: development
      APPLICATION_ENV: development
      KEYCLOAK_URL: http://ebau-keycloak.localhost/auth/
      DATABASE_PASSWORD: camac
      DATABASE_USER: camac
      DJANGO_EMAIL_HOST: mailpit
      DJANGO_EMAIL_PORT: 1025
      OAUTHLIB_INSECURE_TRANSPORT: 1
      OIDC_USERINFO_ENDPOINT: http://ebau-keycloak.localhost/auth/realms/urec/protocol/openid-connect/userinfo
      GWR_FERNET_KEY: GUdwT6yKxqfszrnHC7wyKDmtVZdhjSVQEPnpeJYNLf8=
      GWR_HOUSING_STAT_BASE_URI: https://www-r.housing-stat.ch/regbl/api/ech0216/2
      DOCUMENT_MERGE_SERVICE_URL: http://document-merge-service:8000/document-merge-service/api/v1/
      # Alexandria
      DJANGO_DEFAULT_FILE_STORAGE: django.core.files.storage.FileSystemStorage
      ALEXANDRIA_MANABI_DAV_URL_PATH: /webdav
      TIKA_SERVER_ENDPOINT: http://tika:9998
      CELERY_RDB_HOST: valkey
      CELERY_WORKER_CONCURRENCY: 2
      REDIS_HOST: valkey
      REDIS_USER: default
      REDIS_PASSWORD: valkey
    env_file:
      - ../garage/compose-env/dev-ebau.conf
      - ../garage/compose-env/dev-alexandria.conf
    networks:
      - ebau.localhost
    command: devserver

  ember-caluma-portal:
    image: acr.run/camac-ng/camac-ng/ember-caluma-portal:master
    environment:
      ENABLE_WATERMARK: true
    networks:
      - ebau.localhost

  celery:
    <<: *django
    image: acr.run/camac-ng/camac-ng/django:master
    build:
      context: ../django
      cache_from:
        - acr.run/camac-ng/camac-ng/django:master
      args:
        REQUIREMENTS: requirements-dev.txt
    depends_on:
      - valkey
    profiles:
      - alexandria
      - full
    ports:
      - "6899:6899" # celery rdb
      - "5679:5679" # debugpy
    command: celerydev

  valkey:
    image: valkey/valkey:9.1
    profiles:
      - alexandria
      - full
    volumes:
      - valkey_data:/data
    env_file:
      - ../valkey/valkey-env/valkey.conf
    networks:
      - ebau.localhost

  flower:
    image: mher/flower:2.0
    environment:
      BROKER_URL: redis://default:valkey@valkey:6379/0 # gitleaks:allow
      FLOWER_URL_PREFIX: celery-flower
    networks:
      - ebau.localhost


  mailpit:
    image: axllent/mailpit
    networks:
      - ebau.localhost
    environment:
      - MP_WEBROOT=mailpit

  keycloak:
    ports:
      - "8080:8080"
    depends_on:
      - mailpit
    volumes:
      - ../keycloak/config/${APPLICATION}-test-config.json:/opt/keycloak/data/import/test-config.json
      - ../keycloak/themes/src/main/resources/theme/kanton-uri:/opt/keycloak/themes/kanton-uri-dev
    environment:
      - KC_DB_PASSWORD=camac
      - KC_DB_USERNAME=camac
      - KC_HOSTNAME=ebau-keycloak.localhost
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=camac
    networks:
      - ebau.localhost
    command:
      [
        "start",
        "--spi-theme-static-max-age=-1",
        "--spi-theme-cache-themes=false",
        "--spi-theme-cache-templates=false",
      ]

  document-merge-service:
    image: acr.run/camac-ng/camac-ng/document-merge-service:master
    networks:
      - ebau.localhost
    cap_add:
      - CAP_SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      - ENV=dev
      - ISOLATE_UNOCONV=true
      - OIDC_USERINFO_ENDPOINT=http://ebau-keycloak.localhost/auth/realms/urec/protocol/openid-connect/userinfo
      - CACHE_LOCATION=cache:11211
      - DATABASE_HOST=db
      - DATABASE_NAME=${APPLICATION}
      - DATABASE_USER=camac
      - DATABASE_PASSWORD=camac
      - DATABASE_OPTIONS=options=-c search_path=dms
      - URL_PREFIX=document-merge-service/
      - EXTENSIONS_ARGUMENTS=DJANGO_API=http://django
    env_file:
      - ../garage/compose-env/dev-dms.conf
    user: "${UID:?Set UID env variable to your user id}"
    volumes:
      - ../document-merge-service/extensions:/app/document_merge_service/extensions
      - ../document-merge-service/${APPLICATION}:/tmp/document-merge-service
    command: devserver

  garage:
    volumes:
      - garage_meta:/var/lib/garage/meta/
      - garage_data:/var/lib/garage/data/
      - ../garage/garage.toml:/etc/garage.toml:ro
    env_file:
      - ../garage/compose-env/dev-garage.conf
    networks:
      - ebau.localhost

  garage-webui:
    image: khairul169/garage-webui:latest
    volumes:
      - ../garage/garage.toml:/etc/garage.toml:ro
    ports:
      - 3909:3909
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
    networks:
      - ebau.localhost
    depends_on:
      - garage

networks:
  ebau.localhost:

volumes:
  garage_meta:
    driver: local
  garage_data:
    driver: local
  pg15data:
