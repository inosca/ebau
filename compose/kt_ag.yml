# This configuration is much slimmer than in other cantons as it is only being
# used for building and pushing the application images into the registry and not
# for running an environment via `-prod` or `-stage` compose configuration.

services:
  django:
    image: acr.run/camac-ng/camac-ng/django:${CI_COMMIT_TAG:-master}
    build:
      context: ../django
      cache_from:
        - acr.run/camac-ng/camac-ng/django:${CI_COMMIT_TAG:-master}
      args:
        APPLICATION: ${APPLICATION}

  ember-caluma-portal:
    image: acr.run/camac-ng/camac-ng/ember-caluma-portal:${CI_COMMIT_TAG:-master}
    build:
      context: ../
      dockerfile: ./Dockerfile.ember
      cache_from:
        - acr.run/camac-ng/camac-ng/ember-caluma-portal:${CI_COMMIT_TAG:-master}
      target: prod-env
      args:
        APPLICATION: ${APPLICATION}
        KEYCLOAK_HOST: $${KEYCLOAK_HOST}
        KEYCLOAK_REALM: $${KEYCLOAK_REALM}
        KEYCLOAK_BASE_PATH: $${KEYCLOAK_BASE_PATH}
        KEYCLOAK_CLIENT: $${KEYCLOAK_CLIENT}
        KEYCLOAK_SCOPES: $${KEYCLOAK_SCOPES}
        INTERNAL_URL: $${INTERNAL_URL}
        ENABLE_WATERMARK: $${ENABLE_WATERMARK}
        WATERMARK: $${WATERMARK}
        EVEN_URL: $${EVEN_URL}
        REPLACE_ENV: KEYCLOAK_HOST,KEYCLOAK_REALM,KEYCLOAK_BASE_PATH,KEYCLOAK_CLIENT,KEYCLOAK_SCOPES,INTERNAL_URL,ENABLE_WATERMARK,WATERMARK,EVEN_URL
        WORKSPACE: ember-caluma-portal

  ember-ebau:
    image: acr.run/camac-ng/camac-ng/ember-ebau:${CI_COMMIT_TAG:-master}
    build:
      context: ../
      dockerfile: ./Dockerfile.ember
      cache_from:
        - acr.run/camac-ng/camac-ng/ember-ebau:${CI_COMMIT_TAG:-master}
      target: prod-env
      args:
        APPLICATION: ${APPLICATION}
        KEYCLOAK_HOST: $${KEYCLOAK_HOST}
        KEYCLOAK_REALM: $${KEYCLOAK_REALM}
        KEYCLOAK_BASE_PATH: $${KEYCLOAK_BASE_PATH}
        KEYCLOAK_CLIENT: $${KEYCLOAK_CLIENT}
        KEYCLOAK_SCOPES: $${KEYCLOAK_SCOPES}
        PORTAL_URL: $${PORTAL_URL}
        ENABLE_WATERMARK: $${ENABLE_WATERMARK}
        WATERMARK: $${WATERMARK}
        EVEN_URL: $${EVEN_URL}
        ALEXANDRIA_MANABI_ALLOWED_MIMETYPES: $${ALEXANDRIA_MANABI_ALLOWED_MIMETYPES}
        REPLACE_ENV: KEYCLOAK_HOST,KEYCLOAK_REALM,KEYCLOAK_BASE_PATH,KEYCLOAK_CLIENT,KEYCLOAK_SCOPES,PORTAL_URL,ENABLE_WATERMARK,WATERMARK,ALEXANDRIA_MANABI_ALLOWED_MIMETYPES,EVEN_URL
        WORKSPACE: ember-ebau

  keycloak:
    image: acr.run/camac-ng/camac-ng/keycloak:${CI_COMMIT_TAG:-master}
    build:
      context: ../keycloak
      cache_from:
        - acr.run/camac-ng/camac-ng/keycloak:${CI_COMMIT_TAG:-master}

  document-merge-service:
    image: acr.run/camac-ng/camac-ng/document-merge-service:${CI_COMMIT_TAG:-master}
    build:
      context: ../document-merge-service
      cache_from:
        - acr.run/camac-ng/camac-ng/document-merge-service:${CI_COMMIT_TAG:-master}
      args:
        APPLICATION: ${APPLICATION}

  clamav:
    image: acr.run/camac-ng/camac-ng/clamav:2.6.99
    environment:
      - CONCURRENT_DATABASE_RELOAD=false
      - DEFINITIONS_UPDATE_FREQUENCY=1440
      - DEFINITIONS_UPDATE_BEGIN=0300

  garage:
    image: acr.run/camac-ng/camac-ng/garage:${CI_COMMIT_TAG:-master}
    build:
      context: ../garage
      cache_from:
        - acr.run/camac-ng/camac-ng/garage:${CI_COMMIT_TAG:-master}

  housing-stat-proxy:
    image: acr.run/camac-ng/camac-ng/housing-stat-proxy:${CI_COMMIT_TAG:-master}
    build:
      context: ../housing-stat-proxy
      cache_from:
        - acr.run/camac-ng/camac-ng/housing-stat-proxy:${CI_COMMIT_TAG:-master}
