# Shared dev overrides for the elixir (Phoenix) service, the counterpart of
# `services/elixir.yml`. Cantons pull it into their `-dev.yml` with:
#
#     include:
#       - path: services/elixir-dev.yml
#
# Everything here is canton-agnostic; the canton is what `${APPLICATION}`
# resolves to. Relative paths resolve from this file's directory.
#
# It also carries the one thing another service needs for elixir to work: the
# proxy's `host.docker.internal` mapping, without which nginx cannot resolve
# the upstream in `proxy/snippets/elixir-upstream.conf`. Keeping it here means
# a canton only has to add the `include` above, nothing else.

services:
  proxy:
    # Required so the nginx upstream can resolve `host.docker.internal` to the
    # host machine on Linux (already works out-of-the-box on macOS/Windows).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  elixir:
    build:
      context: ../../elixir-ebau
      target: dev
    # We cache _build, deps and language server folders to prevent having to
    # recompile the entire project everytime. However, if you use the container
    # to develop you don't have formatting (run `mix format` in the container
    # for that) and you don't have any language server integration in your
    # editor (which is highly recommended).
    volumes:
      - ../../elixir-ebau:/app # mounting the source code
      - ../../django/${APPLICATION}/config:/app/priv/test_fixtures/${APPLICATION}/config # mounting the canton config
      - elixir-ebau_build:/app/_build # caching the _build folder to a local volume
      - elixir-ebau_dependencies:/app/deps # caching the dependencies to a local volume
      - elixir-ebau_language-server:/app/.elixir_ls # caching the language server to a local volume
    depends_on:
      - db
    environment:
      - APPLICATION=${APPLICATION}
      - DATABASE_PASSWORD=camac
      - DATABASE_USER=camac
      - DATABASE_NAME=${APPLICATION}
      - DATABASE_HOST=db
      - KEYCLOAK_URL=http://ebau-keycloak.localhost/auth/
      - KEYCLOAK_REALM=ebau
      - KEYCLOAK_CLIENT=camac
      - KEYCLOAK_SCOPES=openid email
      - DJANGO_OIDC_EMAIL_CLAIM=email
      - OIDC_USERNAME_CLAIM=sub
      - ENABLE_WATERMARK=true
      - WATERMARK=local

volumes:
  elixir-ebau_build:
  elixir-ebau_dependencies:
  elixir-ebau_language-server:
