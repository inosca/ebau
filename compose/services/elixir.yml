# Shared definition of the elixir (Phoenix) service.
#
# Cantons that run it pull this in with `include` instead of copying the
# service, so there is one place to change it:
#
#     include:
#       - path: services/elixir.yml
#
# The including file is merged on top, so anything canton-specific (a different
# image tag on stage, an extra environment variable) stays in the canton's own
# file. Relative paths resolve from this file's directory.

services:
  elixir:
    image: acr.run/camac-ng/camac-ng/elixir-ebau:${CI_COMMIT_TAG:-main}
    build:
      context: ../../elixir-ebau
      target: final
      args:
        APPLICATION: ${APPLICATION}
        EBAU_VERSION: ${EBAU_VERSION:-0.0.0-main}
      cache_from:
        - acr.run/camac-ng/camac-ng/elixir-ebau:${CI_COMMIT_TAG:-main}
