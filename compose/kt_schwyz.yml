# This configuration is much slimmer than in other cantons as it is only being
# used for building and pushing the application images into the registry and not
# for running an environment via `-prod` or `-stage` compose configuration.

services:
  django: &django
    image: acr.run/camac-ng/camac-ng/django:${CI_COMMIT_TAG:-main}
    build:
      context: ../django
      cache_from:
        - acr.run/camac-ng/camac-ng/django:${CI_COMMIT_TAG:-main}
      args:
        APPLICATION: ${APPLICATION}

  ember:
    image: acr.run/camac-ng/camac-ng/ember:${CI_COMMIT_TAG:-main}
    build:
      context: ../
      dockerfile: ./Dockerfile.ember
      cache_from:
        - acr.run/camac-ng/camac-ng/ember:${CI_COMMIT_TAG:-main}
      args:
        KEYCLOAK_HOST: $${KEYCLOAK_HOST}
        GIS_HOST: $${GIS_HOST}
        REPLACE_ENV: KEYCLOAK_HOST,GIS_HOST
        WORKSPACE: ember
      target: prod-env

  ember-camac-ng:
    image: acr.run/camac-ng/camac-ng/ember-camac-ng:${CI_COMMIT_TAG:-main}
    build:
      context: ../
      dockerfile: ./Dockerfile.ember
      cache_from:
        - acr.run/camac-ng/camac-ng/ember-camac-ng:${CI_COMMIT_TAG:-main}
      args:
        APPLICATION: ${APPLICATION}
        APP_ENV: $${APP_ENV}
        REPLACE_ENV: APP_ENV
        WORKSPACE: ember-camac-ng
      target: prod-env


  document-merge-service:
    image: acr.run/camac-ng/camac-ng/document-merge-service:${CI_COMMIT_TAG:-main}
    build:
      context: ../document-merge-service
      cache_from:
        - acr.run/camac-ng/camac-ng/document-merge-service:${CI_COMMIT_TAG:-main}
      args:
        APPLICATION: ${APPLICATION}
        DMS_VERSION: 10.0

  garage:
    image: acr.run/camac-ng/camac-ng/garage:${CI_COMMIT_TAG:-main}
    build:
      context: ../garage
      cache_from:
        - acr.run/camac-ng/camac-ng/garage:${CI_COMMIT_TAG:-main}

  gotenberg:
    image: acr.run/camac-ng/camac-ng/gotenberg:${CI_COMMIT_TAG:-main}
    build:
      context: ../gotenberg
      cache_from:
        - acr.run/camac-ng/camac-ng/gotenberg:${CI_COMMIT_TAG:-main}

  keycloak:
    image: acr.run/camac-ng/camac-ng/keycloak:${CI_COMMIT_TAG:-main}
    build:
      args:
        VERSION: 26.7
      context: ../keycloak
      cache_from:
        - acr.run/camac-ng/camac-ng/keycloak:${CI_COMMIT_TAG:-main}
