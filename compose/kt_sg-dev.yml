services:
  proxy:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    user: nginx:nginx
    volumes:
      - ../proxy/kt_sg.conf:/etc/nginx/conf.d/default.conf.in:ro
      - ../proxy/csp_headers.inc:/etc/nginx/conf.d/csp_headers.inc:ro
      - ../proxy/csp_headers_default.inc:/etc/nginx/conf.d/csp_headers_default.inc:ro
      - ../proxy/docker-entrypoint.d/90-nameserver.sh:/docker-entrypoint.d/90-nameserver.sh:ro
      - djangomedia:/var/lib/camac/media:ro
      - djangotmpmedia:/tmp/camac/tmpfiles:ro
    depends_on:
      - django
      - document-merge-service
      - ember-caluma-portal
      - ember-ebau
      - keycloak
      - mailpit
      - garage
    ports:
      - "80:80"
    networks:
      ebau.localhost:
        aliases:
          - ember-ebau.localhost
          - ebau-portal.localhost
          - ebau-keycloak.localhost

  db:
    image: postgres:18-trixie
    user: ${UID}
    environment:
      POSTGRES_USER: camac
      POSTGRES_PASSWORD: camac
      POSTGRES_DATABASE: ${APPLICATION}
    volumes:
      - ../db/init-user-db.sh:/docker-entrypoint-initdb.d/init-user-db.sh:ro
      - pg18data:/var/lib/postgresql
    networks:
      - ebau.localhost

  django: &django
    user: ${UID}
    depends_on:
      - redis
      - db
      - document-merge-service
      - mailpit
      - garage
      - tika
    build:
      args:
        REQUIREMENTS: requirements-dev.txt
    ports:
      - "5678:5678"
    volumes:
      - ../django:/app
      - djangomedia:/var/lib/camac/media
      - djangotmpmedia:/tmp/camac/tmpfiles
      - /app/staticfiles # prevent staticfiles from leaking to the host system
    environment: &django_env
      APPLICATION_ENV: development
      APPLICATION: ${APPLICATION}
      DATABASE_HOST: db
      DATABASE_NAME: ${APPLICATION}
      DATABASE_PASSWORD: camac
      DATABASE_USER: camac
      DJANGO_DEFAULT_FILE_STORAGE: storages.backends.s3.S3Storage
      DJANGO_EMAIL_HOST: mailpit
      DJANGO_EMAIL_PORT: 1025
      DJANGO_INTERNAL_BASE_URL: http://ember-ebau.localhost
      DJANGO_MEDIA_ROOT: /var/lib/camac/media
      DJANGO_TEMPFILE_DOWNLOAD_URL: /tmp
      DJANGO_USE_REDIS_CACHE: true
      DOCUMENT_MERGE_SERVICE_URL: http://document-merge-service:8000/document-merge-service/api/v1/
      ENABLE_HISTORICAL_API: true
      ENV: dev # needed for manabi dev mode
      LANGUAGE_CODE: de
      LANGUAGES: de
      OAUTHLIB_INSECURE_TRANSPORT: 1
      PYTHONDONTWRITEBYTECODE: 1
      # OIDC
      KEYCLOAK_URL: http://ebau-keycloak.localhost/auth/
      OIDC_USERINFO_ENDPOINT: http://ebau-keycloak.localhost/auth/realms/ebau/protocol/openid-connect/userinfo
      # GWR
      GWR_FERNET_KEY: GUdwT6yKxqfszrnHC7wyKDmtVZdhjSVQEPnpeJYNLf8=
      GWR_HOUSING_STAT_BASE_URI: https://www-r.housing-stat.ch/regbl/api/ech0216/2
      # Caluma
      EVENT_RECEIVER_MODULES: camac.caluma.extensions.events
      VISIBILITY_CLASSES: camac.caluma.extensions.visibilities.CustomVisibility
      PERMISSION_CLASSES: camac.caluma.extensions.permissions.CustomPermission
      VALIDATION_CLASSES: camac.caluma.extensions.validations.CustomValidation
      DATA_SOURCE_CLASSES: camac.caluma.extensions.data_sources.Municipalities,camac.caluma.extensions.data_sources.Countries,camac.caluma.extensions.data_sources.Applicants
      DYNAMIC_GROUPS_CLASSES: camac.caluma.extensions.dynamic_groups.CustomDynamicGroups
      DYNAMIC_TASKS_CLASSES: camac.caluma.extensions.dynamic_tasks.CustomDynamicTasks
      FORMAT_VALIDATOR_CLASSES: camac.caluma.extensions.format_validators.DateAfterValidator
      # Alexandria
      TIKA_SERVER_ENDPOINT: "http://tika:9998"
      # celery
      CELERY_RDB_HOST: 0.0.0.0. # to be able to telnet from outside the container
      PYTHONUNBUFFERED: 1
      CELERY_WORKER_CONCURRENCY: 1
    env_file:
      - ../garage/compose-env/dev-ebau.conf
      - ../garage/compose-env/dev-alexandria.conf
    networks:
      - ebau.localhost
    tty: true
    stdin_open: true
    command: devserver

  celery:
    <<: *django
    image: acr.run/camac-ng/camac-ng/django:master
    build:
      context: ../django
      cache_from:
        - acr.run/camac-ng/camac-ng/django:master
      args:
        REQUIREMENTS: requirements-dev.txt
    environment:
      <<: *django_env
    ports: []
    command: celerydev

  celery-beat:
    <<: *django
    image: acr.run/camac-ng/camac-ng/django:master
    build:
      context: ../django
      cache_from:
        - acr.run/camac-ng/camac-ng/django:master
      args:
        REQUIREMENTS: requirements-dev.txt
    ports: []
    command: celery-beat-dev

  ember-caluma-portal:
    user: nginx:nginx
    environment:
      KEYCLOAK_HOST: http://ebau-keycloak.localhost
      INTERNAL_URL: http://ember-ebau.localhost
      ENABLE_WATERMARK: true
      WATERMARK: local
    networks:
      - ebau.localhost

  ember-ebau:
    user: nginx:nginx
    environment:
      KEYCLOAK_HOST: http://ebau-keycloak.localhost
      PORTAL_URL: http://ebau-portal.localhost
      ENABLE_WATERMARK: true
      WATERMARK: local
    networks:
      - ebau.localhost

  keycloak:
    user: keycloak:keycloak
    depends_on:
      - db
    volumes:
      - ../keycloak/config/${APPLICATION}-test-config.json:/opt/keycloak/data/import/test-config.json
    environment:
      KC_DB_PASSWORD: camac
      KC_DB_URL: jdbc:postgresql://db:5432/${APPLICATION}?currentSchema=keycloak
      KC_DB_USERNAME: camac
      KC_HOSTNAME: ebau-keycloak.localhost
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    networks:
      - ebau.localhost
    command:
      [
        "start",
        "--spi-theme-static-max-age=-1",
        "--spi-theme-cache-themes=false",
        "--spi-theme-cache-templates=false",
      ]

  mailpit:
    image: axllent/mailpit
    user: ${UID}
    networks:
      - ebau.localhost
    environment:
      MP_WEBROOT: mailpit

  document-merge-service:
    user: ${UID}
    depends_on:
      - redis
      - db
      - garage
    networks:
      - ebau.localhost
    cap_add:
      - CAP_SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      CACHE_BACKEND: django.core.cache.backends.redis.RedisCache
      CACHE_LOCATION: redis://default:redis@redis:6379/3
      CACHE_OPTIONS: socket_connect_timeout=0.1,socket_timeout=0.1
      DATABASE_HOST: db
      DATABASE_NAME: ${APPLICATION}
      DATABASE_PASSWORD: camac
      DATABASE_USER: camac
      DATABASE_OPTIONS: "options=-c search_path=dms"
      ENV: dev
      EXTENSIONS_ARGUMENTS: DJANGO_API=http://django
      FILE_STORAGE: storages.backends.s3.S3Storage
      ISOLATE_UNOCONV: true
      OIDC_USERINFO_ENDPOINT: http://ebau-keycloak.localhost/auth/realms/ebau/protocol/openid-connect/userinfo
      URL_PREFIX: document-merge-service/
    volumes:
      - ../document-merge-service/extensions:/app/document_merge_service/extensions
      - ../document-merge-service/${APPLICATION}/dump.json:/tmp/document-merge-service/dump.json
    env_file:
      - ../garage/compose-env/dev-dms.conf
    command: devserver

  # Fix permissions on named volumes
  volume-permission-companion:
    image: alpine
    restart: on-failure:5
    volumes:
      - pg18data:/data/pg18data
      - djangomedia:/data/djangomedia
      - djangotmpmedia:/data/djangotmpmedia
      - garage_meta:/data/garage_meta
      - garage_data:/data/garage_data
    command: /bin/sh -c "chown ${UID} -R /data;"
    networks:
      - ebau.localhost

  tika:
    image: apache/tika:3.2.3.0-full
    user: ${UID}
    networks:
      - ebau.localhost

  redis:
    image: redis:8.4
    volumes:
      - redis_data:/redis/data
    networks:
      - ebau.localhost
    ports:
      # Only needed in dev environments to use RedisInsight for debugging
      - "6379:6379"

  garage:
    volumes:
      - garage_meta:/var/lib/garage/meta/
      - garage_data:/var/lib/garage/data/
      - ../garage/garage.toml:/etc/garage.toml:ro
    env_file:
      - ../garage/compose-env/dev-garage.conf
    networks:
      - ebau.localhost

  garage-webui:
    image: khairul169/garage-webui:latest
    volumes:
      - ../garage/garage.toml:/etc/garage.toml:ro
    ports:
      - 3909:3909
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
    networks:
      - ebau.localhost
    depends_on:
      - garage

networks:
  ebau.localhost:

volumes:
  pg18data:
  djangomedia:
  djangotmpmedia:
  redis_data:
  garage_meta:
    driver: local
  garage_data:
    driver: local
