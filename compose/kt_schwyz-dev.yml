services:
  cache:
    ports:
      - "11211:11211"
    networks:
      - ebau.localhost

  proxy:
    depends_on:
      - mailpit
    volumes:
      - ../proxy/kt_schwyz.conf:/etc/nginx/conf.d/default.conf.in:ro
      - ../proxy/csp_headers.inc:/etc/nginx/conf.d/csp_headers.inc:ro
      - ../proxy/docker-entrypoint.d/90-nameserver.sh:/docker-entrypoint.d/90-nameserver.sh:ro
    ports:
      - "80:80"
    networks:
      ebau.localhost:
        aliases:
          - ebau.localhost
          - ebau-portal.localhost
          - ebau-rest-portal.localhost
          - ebau-keycloak.localhost

  clamav:
    profiles:
      - full
    ports:
      - "3310:3310"
    environment:
      - ENABLE_DEFINITIONS_UPDATE=false
    networks:
      - ebau.localhost

  db:
    image: postgres:16-bookworm
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=camac
      - POSTGRES_USER=camac
      - POSTGRES_DATABASE=${APPLICATION}
    volumes:
      - pg16data:/var/lib/postgresql/data
      - ../db/init-user-db.sh:/docker-entrypoint-initdb.d/init-user-db.sh:ro
    networks:
      - ebau.localhost
    command: -c max_locks_per_transaction=128

  django: &django
    image: acr.run/camac-ng/camac-ng/django:master
    build:
      cache_from:
        - acr.run/camac-ng/camac-ng/django:master
      args:
        REQUIREMENTS: requirements-dev.txt
    ports:
      - "5555:5555"
      - "5678:5678"
    volumes:
      - ../django:/app
      - /app/staticfiles # prevent staticfiles from leaking to the host system
    depends_on:
      - db
      - mailpit
    environment:
      - ENV=development
      - APPLICATION_ENV=development
      - KEYCLOAK_URL=http://ebau-keycloak.localhost/auth/
      - ECH0211_API_ACTIVE=True
      - DATABASE_HOST=db
      - DATABASE_NAME=${APPLICATION}
      - DATABASE_PASSWORD=camac
      - DATABASE_USER=camac
      - DJANGO_EMAIL_HOST=mailpit
      - DJANGO_EMAIL_PORT=1025
      - DJANGO_Q_ENABLE_SYNC=${DJANGO_Q_ENABLE_SYNC:-false}
      - OAUTHLIB_INSECURE_TRANSPORT=1
      - OIDC_USERINFO_ENDPOINT=http://ebau-keycloak.localhost/auth/realms/ebau/protocol/openid-connect/userinfo
      - GWR_FERNET_KEY=GUdwT6yKxqfszrnHC7wyKDmtVZdhjSVQEPnpeJYNLf8=
      - GWR_HOUSING_STAT_BASE_URI=https://www-r.housing-stat.ch/regbl/api/ech0216/2
      - MANABI_ENABLE=False
    networks:
      - ebau.localhost
    command: devserver

  # repeat definition here because otherwise prod settings are applied
  django-q:
    <<: *django
    command: qclusterdev
    ports: []

  ember:
    image: acr.run/camac-ng/camac-ng/ember:master
    networks:
      - ebau.localhost

  ember-camac-ng:
    image: acr.run/camac-ng/camac-ng/ember-camac-ng:master
    networks:
      - ebau.localhost


  unoconv:
    ports:
      - "3000:3000"
    networks:
      - ebau.localhost

  keycloak:
    depends_on:
      - db
    ports:
      - "8080:8080"
    volumes:
      - ../keycloak/config/${APPLICATION}-test-config.json:/opt/keycloak/data/import/test-config.json
      - ../keycloak/themes/src/main/resources/theme/kanton-schwyz:/opt/keycloak/themes/kanton-schwyz-dev
    environment:
      - KC_DB_URL=jdbc:postgresql://db:5432/${APPLICATION}
      - KC_DB_PASSWORD=camac
      - KC_DB_USERNAME=camac
      - KC_HOSTNAME=ebau-keycloak.localhost
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=camac
    networks:
      - ebau.localhost
    command:
      [
        "start",
        "--spi-theme-static-max-age=-1",
        "--spi-theme-cache-themes=false",
        "--spi-theme-cache-templates=false",
      ]

  mailpit:
    image: axllent/mailpit
    networks:
      - ebau.localhost
    environment:
      - MP_WEBROOT=mailpit

  metabase:
    depends_on:
      - db
    environment:
      - MB_DB_USER=camac
      - MB_DB_PASS=camac
      - MB_DB_HOST=db
    networks:
      - ebau.localhost

networks:
  ebau.localhost:

volumes:
  pg16data:
