services:
  cache:
    image: memcached:1.6-alpine

  proxy:
    image: nginx:1.29-alpine
    depends_on:
      - ember-caluma-portal
      - django
      - keycloak
      - ember-camac-ng
    volumes:
      - djangomedia:/var/lib/camac/media:ro
      - djangotmpmedia:/tmp/camac/tmpfiles:ro

  db:
    image: postgres:15-bullseye
    environment:
      - POSTGRES_USER=camac
      - POSTGRES_DATABASE=${APPLICATION}

  ember-camac-ng:
    build:
      context: ../
      dockerfile: ./Dockerfile.ember
      cache_from:
        - acr.run/camac-ng/camac-ng/ember-camac-ng:master
      args:
        - APPLICATION=${APPLICATION}
        - ENABLE_WATERMARK=${ENABLE_WATERMARK:-false}
        - WATERMARK=${WATERMARK:-local}
        - WORKSPACE=ember-camac-ng
      target: prod

  django: &django
    build:
      context: ../django
      cache_from:
        - acr.run/camac-ng/camac-ng/django:master
      args:
        - APPLICATION=${APPLICATION}
    depends_on:
      - db
      - keycloak
      - cache
    environment:
      - DATABASE_HOST=db
      - DATABASE_NAME=${APPLICATION}
      - DJANGO_CACHE_LOCATION=cache:11211
      - DJANGO_MEDIA_ROOT=/var/lib/camac/media
      - DJANGO_CLAMD_TCP_ADDR=clamav
      - APPLICATION=${APPLICATION}
      - CACHE_BACKEND=django.core.cache.backends.memcached.PyMemcacheCache
      - CACHE_LOCATION=cache:11211
      - EVENT_RECEIVER_MODULES=camac.caluma.extensions.events
      - VISIBILITY_CLASSES=camac.caluma.extensions.visibilities.CustomVisibility
      - PERMISSION_CLASSES=camac.caluma.extensions.permissions.CustomPermission
      - VALIDATION_CLASSES=camac.caluma.extensions.validations.CustomValidation
      - DATA_SOURCE_CLASSES=camac.caluma.extensions.data_sources.Locations,camac.caluma.extensions.data_sources.Countries,camac.caluma.extensions.data_sources.Mitberichtsverfahren,camac.caluma.extensions.data_sources.Authorities,camac.caluma.extensions.data_sources.Municipalities,camac.caluma.extensions.data_sources.ServicesForFinalReport,camac.caluma.extensions.data_sources.Sanctions
      - DYNAMIC_GROUPS_CLASSES=camac.caluma.extensions.dynamic_groups.CustomDynamicGroups
      - DYNAMIC_TASKS_CLASSES=camac.caluma.extensions.dynamic_tasks.CustomDynamicTasks
      - LANGUAGE_CODE=de
      - LANGUAGES=de,fr
      - OIDC_USERNAME_CLAIM=preferred_username
      - OIDC_BOOTSTRAP_BY_EMAIL_FALLBACK=true
      - URI_MIGRATE_PORTAL_USER=true
      - META_FIELDS=camac-instance-id,ebau-number,submit-date
      - ENABLE_HISTORICAL_API=true
      - KEYCLOAK_REALM=urec
      - DJANGO_USE_X_FORWARDED_HOST=True
      - VISIBILITY_PERFORMANCE_OPTIMISATIONS_ACTIVE=True
    volumes:
      - djangomedia:/var/lib/camac/media
      - djangotmpmedia:/tmp/camac/tmpfiles

  celery:
    <<: *django
    image: acr.run/camac-ng/camac-ng/django:master
    build:
      context: ../django
      cache_from:
        - acr.run/camac-ng/camac-ng/django:master
      args:
        REQUIREMENTS: requirements-dev.txt
    depends_on:
      - valkey
    profiles:
      - alexandria
      - full
    command: celery
    ports: []

  tika:
    image: apache/tika:3.2.3.0-full
    profiles:
      - alexandria
      - full

  valkey:
    image: valkey/valkey:9.1
    profiles:
      - alexandria
      - full
    volumes:
      - valkey_data:/data
    env_file:
      - ../valkey/valkey-env/valkey.conf

  ember-caluma-portal:
    build:
      context: ../
      dockerfile: ./Dockerfile.ember
      cache_from:
        - acr.run/camac-ng/camac-ng/ember-caluma-portal:master
      args:
        - APPLICATION=${APPLICATION}
        - ENABLE_WATERMARK=${ENABLE_WATERMARK:-false}
        - WATERMARK=${WATERMARK:-local}
        - WORKSPACE=ember-caluma-portal
      target: prod


  clamav:
    image: acr.run/camac-ng/camac-ng/clamav:2.6.99
    environment:
      - CONCURRENT_DATABASE_RELOAD=false
      - DEFINITIONS_UPDATE_FREQUENCY=1440
      - DEFINITIONS_UPDATE_BEGIN=0300

  keycloak:
    depends_on:
      - db
    build:
      context: ../keycloak
      args:
        VERSION: 26.5.3
      target: keycloak-v26
      cache_from:
        - acr.run/camac-ng/camac-ng/keycloak:master
    environment:
      - KC_DB_URL=jdbc:postgresql://db:5432/${APPLICATION}?currentSchema=keycloak

  document-merge-service:
    depends_on:
      - cache
    build:
      context: ../document-merge-service
      cache_from:
        - acr.run/camac-ng/camac-ng/document-merge-service:master
      args:
        APPLICATION: ${APPLICATION}
        CACHE_LOCATION: cache:11211
        EXTENSIONS_ARGUMENTS: DJANGO_API=http://django
    volumes:
      - ../document-merge-service/kt_uri:/tmp/document-merge-service

  garage:
    image: acr.run/camac-ng/camac-ng/garage:${CI_COMMIT_TAG:-master}
    build:
      context: ../garage
      cache_from:
        - acr.run/camac-ng/camac-ng/garage:${CI_COMMIT_TAG:-master}

volumes:
  djangomedia:
  djangotmpmedia:
  dmsfiles:
  pgdata:
  phpsessions:
  templatefiles:
  valkey_data:
