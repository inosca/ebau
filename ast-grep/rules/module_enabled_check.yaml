id: use-is-module-enabled-config
language: python
severity: error
message: 'Use `is_module_enabled("$MODULE")` instead of reading the module config directly'
note: |
  Import it with `from camac.settings.utils import is_module_enabled`.
  `is_module_enabled` works for both pydantic (`.enabled`) and dict
  (`["ENABLED"]` or `.get("ENABLED")`) module configs, so prefer it for all
  module enable checks.
rule:
  any:
    - pattern: settings.$MODULE.enabled
    - pattern: settings.$MODULE["ENABLED"]
    - pattern: settings.$MODULE.get("ENABLED")
    - pattern: settings.$MODULE.get("ENABLED", False)
constraints:
  MODULE:
    matches: module-settings-name
fix: 'is_module_enabled("$MODULE")'
---
id: use-is-module-enabled-empty-dict
language: python
severity: error
message: 'Use `is_module_enabled("$MODULE")` instead of the bare `settings.$MODULE` truthiness check'
note: |
  Import it with `from camac.settings.utils import is_module_enabled`. A bare
  `settings.MODULE` check relies on the config being falsy when disabled, which
  does not hold for pydantic module configs. Use `is_module_enabled("MODULE")`
  instead.
rule:
  any:
    - all:
        - pattern: settings.$MODULE
        - any:
            - inside: { kind: if_statement, field: condition }
            - inside: { kind: elif_clause, field: condition }
            - inside: { kind: while_statement, field: condition }
            - inside: { kind: not_operator }
            # operands of `and` (but not `or`, which is also used for value
            # fallbacks like `permission_settings or settings.PERMISSIONS`)
            - inside: { pattern: $L and $R, field: left }
            - inside: { pattern: $L and $R, field: right }
    - pattern: bool(settings.$MODULE)
constraints:
  MODULE:
    matches: module-settings-name
fix: 'is_module_enabled("$MODULE")'
---
id: register-module-settings-name
language: python
severity: error
message: "Add `$NAME` to the `module-settings-name` util rule in `ast-grep/utils/module_settings.yaml`"
note: |
  The rules above can only lint enable checks for modules that are listed in the
  `module-settings-name` util rule, and `ast-grep` cannot derive that list from
  the Django settings. Add the module name to its regex, keeping the list
  alphabetically sorted, so its enable checks are linted as well.
files:
  - django/camac/settings/django.py
rule:
  pattern: $NAME = load_module_settings($$$ARGS)
constraints:
  NAME:
    not:
      matches: module-settings-name
