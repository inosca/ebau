id: fix-pytest-db-fixture-only
language: python
severity: error
message: "Do not use the `db` fixture in tests"
note: "Use the `@pytest.mark.django_db` mark instead"
rule:
  pattern: "def $FUNC(db): $$$BODY"
constraints:
  FUNC: { regex: "^test_" }
fix: |
  @pytest.mark.django_db
  def $FUNC():
      $$$BODY
---
id: fix-pytest-db-fixture-first
language: python
severity: error
message: "Do not use the `db` fixture in tests"
note: "Use the `@pytest.mark.django_db` mark instead"
rule:
  pattern: "def $FUNC(db, $$$POST): $$$BODY"
constraints:
  FUNC: { regex: "^test_" }
fix: |
  @pytest.mark.django_db
  def $FUNC($$$POST):
      $$$BODY
---
