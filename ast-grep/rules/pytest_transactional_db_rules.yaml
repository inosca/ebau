id: fix-pytest-transactional-db-fixture-only
language: python
severity: error
message: "Do not use the `transactional_db` fixture in tests"
note: "Use the `@pytest.mark.django_db(transaction=True)` mark instead"
rule:
  pattern: "def $FUNC(transactional_db): $$$BODY"
constraints:
  FUNC: { regex: "^test_" }
fix: |
  @pytest.mark.django_db(transaction=True)
  def $FUNC():
      $$$BODY
---
