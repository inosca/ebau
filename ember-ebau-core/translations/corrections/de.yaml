corrections:
  not-available: "Diese Funktion ist im aktuellen Zustand nicht verfügbar."

  document:
    title: "Dossier korrigieren"
    description: "Diese Funktion erlaubt es, kleine Korrekturen am Gesuchsformular vorzunehmen (z.B. Präzisierung des Baubeschriebs)."
    button: "Dossier korrigieren"
    description-finish-start: "Sie können die Dossierkorrektur jetzt im Menü"
    description-finish-link: "Formular"
    description-finish-end: "vornehmen. Bitte vergessen sie nicht die Korrektur anschliessend abzuschliessen."
    button-finish: "Korrektur abschliessen"

    confirm: "Bitte beachten Sie, dass die Dossierkorrektur nur für kleine Änderungen gedacht ist (z.B. Korrektur von Kontaktinformationen, Präzisierung Baubeschrieb). Gegebenenfalls sind die Gesuchstellenden über die Änderungen zu informieren.<br><br>Bitte prüfen Sie bei grösserem Änderungsbedarf, ob allenfalls eine Rückweisung angebracht wäre."
    confirm-finish: "Bitte prüfen Sie bei relevanten Änderungen, ob allenfalls eine neue Eingabequittung angebracht wäre."
    error: "Fehler beim Korrigieren des Dossiers"
    invalid: "Dossier ist in einem ungültigen Zustand zum Abschliessen. Gewisse fragen sind noch nicht korrekt ausgefüllt."

  withdraw:
    title: "Dossier zurückziehen"
    description: "Diese Funktion erlaubt es, einen Rückzug der Gesuchstellenden bei Papier-Dossiers in eBau nachzuführen."
    confirm: "Sind Sie sicher, dass Sie das Dossier zurückziehen möchten?"
    success: "Das Dossier wurde erfolgreich zurückgezogen"
    error: "Fehler beim Zurückziehen des Dossiers"

  change-form:
    title: "Dossiertyp ändern"
    description: "Hier können Sie falsche Dossiertypen korrigieren. Dies ist nur mit den Typen im Dropdown möglich."
    not-possible: "Der Dossiertyp von diesem Dossier kann nicht geändert werden."
    form-label: "Formular zum Ändern des Dossiertyps"
    label: "Dossiertyp"
    confirm: "Wollen Sie den Dossiertyp wirklich ändern?"
    error: "Fehler beim Ändern des Dossiertyps"
    success: "Der Dossiertyp wurde erfolgreich geändert"
    invalid-form-hint: |-
      <strong>Achtung:</strong> Das Formular dieses Dossiers ist nun nicht mehr
      vollständig ausgefüllt. Sie können die fehlenden Daten mithilfe der
      Funktion "Dossier korrigieren" ergänzen.
