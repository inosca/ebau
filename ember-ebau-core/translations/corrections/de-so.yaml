corrections:
  bauherrin:
    email-warning: >-
      Mit der Einreichung eines Gesuchs wird neu automatisch durch eBau der/die erfasste(n)
      Gesuchsteller/innen (Bauherrschaft) mit der neuen Rolle "Bauherrschaft" für das Gesuch
      berechtigt. Daher darf über die Korrekturhilfe nicht die eMail-Adresse(-n) des / der
      Gesuchstellenden (Bauherrschaft) verändert und auch nicht neue Gesuchstellende
      (Bauherrschaft) hinzugefügt werden. Diese Gesuche müssen zurückgewiesen und mit den
      korrekten Angaben zu den Gesuchstellenden (Bauherrschaft) neu eingereicht werden.
