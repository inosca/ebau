corrections:
  document:
    description: "La funzione «Correggi dossier» consente al Comune di apportare piccole correzioni al modulo di richiesta (ad es. precisazioni della descrizione del progetto). Le modifiche sostanziali devono essere effettuate dai richiedenti nel modulo tramite una richiesta di precisazioni (Consentire modifiche al modulo di richiesta)."
    description-applicant-correction: "Per consentire ai richiedenti di modificare i dati nel formulario della domanda, create una richiesta di precisazioni con l’opzione «Consentire modifiche al modulo di richiesta»."
    link-applicant-correction: "Richiesta di precisazioni"

  change-form:
    invalid-form-hint: |-
      <strong>Attenzione:</strong> il formulario di questo dossier non è stato compilato completamente. Create una richiesta di precisazioni con l’opzione «Consentire modifiche al modulo di richiesta» e richiedete una nuova ricevuta.
