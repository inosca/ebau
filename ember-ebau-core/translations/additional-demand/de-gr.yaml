additional-demand:
  hint: |+
    <div class="uk-alert">
    <strong>Hinweis:</strong> Die Nachforderung wird dem Gesuchstellenden direkt zugestellt. Aktenergänzungen über die Leitbehörde (Gemeinde oder ARE) haben über die Zirkulation zu erfolgen.
    </div>
  allow-changes-hint: "<strong>Hinweis:</strong> Mit der Freigabe der Änderung des Gesuchsformulars können die Gesuchstellenden das eBau-Formular und die Dokumente anpassen. Bereits gestempelte Dokumente können nicht als ungültig markiert werden. Entfernen Sie bei Bedarf zuerst die Stempel der betroffenen Dokumente."
  formtimeline-link:
    instance-edit-info: |
      <strong>Hinweis:</strong> Wählen Sie «Dossier anpassen», um die Nachforderung zu bearbeiten. Damit gelangen Sie zum Gesuchsformular, das Sie korrigieren können. Zudem können Sie neue Dokumente hochladen oder nicht mehr gültige Dokumente als ungültig markieren. Kehren Sie anschliessend zu dieser Seite zurück und reichen Sie die Änderungen bei der zuständigen Behörde ein.
