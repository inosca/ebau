    310000: AFG Gewässerschutz, Baubegleitung und -Abnahme

  organizations:
    cantonal: Kantonal
    municipal: Kommunal

  calculations:
    flat: "{totalCost, number, ::.00} {taxMode}"
    percentage: "{percentage, number, ::.00 % scale/0.01} von {totalCost, number, ::.00} {taxMode}"
    hourly: "{hours, number, ::.00} Std à {hourlyRate, number, ::.00} {taxMode}"
    ag_processing_fee: |-
      {totalCost, number, ::.00} CHF Baukosten, davon<br>
      0-133'334.95 CHF = 400.00 CHF<br>
      133'335 - 2Mio. = 3‰<br>
      2-5Mio. = 2.5‰<br>
      >5Mio = 1.5‰

    titles:
      flat: pauschal
      percentage: prozentual
      hourly: nach Aufwand
      ag_processing_fee: Behandlungsgebühr BG BVUAFB

  tax-modes:
    exempt: nicht MWSt-pflichtig
    inclusive: "inkl. {taxRate, number, ::.0 % scale/0.01} MWSt"
    exclusive: "exkl. {taxRate, number, ::.0 % scale/0.01} MWSt"

  totals:
    cantonal:
      uncharged: Subtotal Kanton (nicht verrechnet)
      total: Subtotal Kanton
    municipal:
      uncharged: Subtotal Gemeinde (nicht verrechnet)
      total: Subtotal Gemeinde
    all:
      uncharged: Total (nicht verrechnet)
      total: Total

  billing-type: Verrechnung
  billing-type-info: |-
    <ul>
      <li>
        <strong>Weiter zu verrechnen:</strong>
        Fachstelle informiert über Gebühr, die die Gemeinde berücksichtigen
        muss.
      </li>
      <li>
        <strong>Rechnung zu eröffnen:</strong>
        Fachstelle erstellt Rechnung und schickt diese an die Gemeinde zur
        weiteren Bearbeitung. Inkasso durch Fachstelle.
      </li>
      <li>
        <strong>Direkt verrechnet:</strong>
        Fachstelle hat ihre Gebührenrechnung direkt an den Gesuchstellenden
        versendet. Inkasso durch Fachstelle.
      </li>
      <li>
        <strong>Kantonale Gebührenrechnung für Bauen ausserhalb Bauzone:</strong>
        Die kantonale Koordinationsstelle Bauen ausserhalb Bauzone (ARP) erstellt die
        kantonale Gebührenrechnung (mit den Gebühren jeder kant. Fachstelle / Unter-
        fachstelle) und schickt diese zusammen mit dem kantonalen Entscheid an die
        örtliche Baubehörde (Gemeinde) zur Eröffnung an die / den Gesuchstellende(-n).
        Das Inkasso erfolgt durch das ARP (Administration).
      </li>
      <li>
        <strong>Kantonale Gebührenrechnung bei kantonaler Baubehörde:</strong>
        Die kantonale Baubehörde (ARP) erstellt die kantonale Gebührenrechnung (mit den
        Gebühren jeder kant. Fachstelle / Unterfachstelle) und eröffnet diese zusammen mit
        dem kantonalen Entscheid an die / den Gesuchstellende(-n). Das Inkasso erfolgt durch
        das ARP (Administration).
      </li>
    </ul>

  billing-types:
    by_authority: Weiter zu verrechnen
    forwarded: Rechnung zu eröffnen
    direct: Direkt verrechnet
    construction_outside_zone: Kantonale Gebührenrechnung für Bauen ausserhalb Bauzone 
    cantonal_construction_administration: Kantonale Gebührenrechnung bei kantonaler Baubehörde 

  filters:
    createdAfter: Erstellung von
    createdBefore: Erstellung bis
    service: Organisation

  templates:
    info: Eine Vorlage anwenden
    select: Vorlage auswählen
    apply: Vorlage anwenden
