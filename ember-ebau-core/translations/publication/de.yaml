  preview:
    baubewilligung: "Gemeindebaubehörde {authority}\r\n\r\nStandeskanzlei Uri\r\nRedaktion Amtsblatt\r\nRathaus\r\n6460 Altdorf\r\n\r\n{zip} {location}, {date}\r\n\r\n\r\nMeldung einer Bauplanauflage zur Publikation im Amtsblatt unter der Rubrik\r\n\"Bau und Planungsrecht\"\r\n\r\nSehr geehrte Damen und Herren\r\n\r\nWir bitten Sie, folgende Bauplanauflage im Amtsblatt vom Freitag {publishDate}\r\nzu publizieren:\r\n\r\n{location}\r\n\r\nBauherrschaft: {applicantsFormatted}\r\nBauvorhaben: {intent}\r\nBauplatz: {plotsFormatted}\r\nParzelle(n): {plotNumbers}\r\nBemerkungen: {comments}\r\n\r\nBemerkungen ans Amtsblatt: {commentsToTheOfficialGazette}\r\n\r\n\r\nWir danken Ihnen für Ihre Bemühungen und stehen bei Fragen gerne zur Verfügung\r\n\r\nFreundliche Grüsse\r\n\r\nGemeindebaubehörde {authority}\r\n\r\n\r\n{zip} {location}, {date}\r\n"
    nutzungsplanung: "Gemeinde {location}\r\n\r\nAltdorf, {date}\r\n\r\nMeldung eines Auflage- und Einspracheverfahrens zur Publikation im Amtsblatt unter der Rubrik \"Bau und Planungsrecht\" und im amtlichen Publikationsorgan (APO)\r\n\r\nSehr geehrte Damen und Herren\r\n\r\nWir bitten Sie, folgendes Auflage- und Einspracheverfahren im Amtsblatt vom Freitag {publishDate} bzw. ab Freitag {publishDate} im APO zu publizieren:\r\n\r\nÄnderung des Nutzungsplans Gemeinde {location}\r\n\r\nGestützt auf Artikel 43 des Planungs- und Baugesetzes (PBG; RB 40.1111) wird während 30 Tagen die folgende Änderung des Nutzungsplans ({intent}) der Gemeinde {location} öffentlich aufgelegt:\r\n\r\n{attachments}Die Auflage erfolgt auf der Gemeindekanzlei und im Kataster der öffentlich-rechtlichen Eigentumsbeschränkungen (oereb.ur.ch/auflage).\r\n\r\nInnerhalb der Auflagefrist können schriftliche Einsprachen mit bestimmten Begehren und begründet beim Gemeinderat eingereicht werden.\r\n\r\nBemerkungen ans Amtsblatt: {commentsToTheOfficialGazette}\r\n\r\n{location}, {date} {authority}\r\n\r\nWir danken Ihnen für Ihre Bemühungen und stehen bei Fragen gerne zur Verfügung\r\n\r\nFreundliche Grüsse\r\n\r\n{authority}\r\n"
    gemeindlicheNutzungsplanung: "Gemeinde {location} \r\n\r\n{location}, {date}\r\n\r\nMeldung eines Auflage- und Einspracheverfahrens zur Publikation im Amtsblatt unter der Rubrik \"Bau und Planungsrecht\" und im amtlichen Publikationsorgan (APO)\r\n\r\nSehr geehrte Damen und Herren\r\n\r\nWir bitten Sie, folgendes Auflage- und Einspracheverfahren im Amtsblatt vom Freitag {publishDate} bzw. ab Freitag {publishDate} im APO zu publizieren:\r\n\r\nÄnderung des Nutzungsplans der Gemeinde {location}\r\n\r\nGestützt auf Artikel 43 des Planungs- und Baugesetzes (PBG; RB 40.1111) wird während 30 Tagen die Änderung des Nutzungsplans der Gemeinde {location} öffentlich aufgelegt:\r\n\r\nDokumente:\r\n{attachments}\r\n\r\nDie Auflage erfolgt auf der Gemeindekanzlei. Die öffentliche Auflage der massgeblichen digitalen Daten erfolgt gestützt auf Art. 1 und Art. 13 Abs. 1 Bst. a des Gesetzes über die amtliche Publikation (Publikationsgesetz, PUG; RB 3.1310) im Kataster der öffentlich-rechtlichen Eigentumsbeschränkungen (oereb.ur.ch/auflage).\r\n\r\nInnerhalb der Auflagefrist können schriftliche Einsprachen mit bestimmten Begehren und begründet beim Gemeinderat eingereicht werden.\r\n\r\nBemerkungen ans Amtsblatt: {commentsToTheOfficialGazette}\r\n\r\n {location}, {date} Gemeinderat {location}\r\n\r\nWir danken Ihnen für Ihre Bemühungen und stehen bei Fragen gerne zur Verfügung\r\n\r\nFreundliche Grüsse\r\n\r\nGemeinderat {location}\r\n"
    sondernutzungsplanung: "Gemeinde {location}\r\n\r\n{location}, {date}\r\n\r\nMeldung eines Auflage- und Einspracheverfahrens zur Publikation im Amtsblatt unter der Rubrik \"Bau und Planungsrecht\" und im amtlichen Publikationsorgan (APO)\r\n\r\nSehr geehrte Damen und Herren\r\n\r\nWir bitten Sie, folgendes Auflage- und Einspracheverfahren im Amtsblatt vom Freitag {publishDate} bzw. ab Freitag {publishDate} im APO zu publizieren:\r\n\r\n{intent} Gemeinde {location}\r\n\r\nGestützt auf Artikel 55 des Planungs- und Baugesetzes (PBG; RB 40.1111) wird während 30 Tagen der {intent} der Gemeinde {location} öffentlich aufgelegt:\r\n\r\nDokumente:\r\n{attachments}\r\nPlanungsperimeter:\r\n- {plotNumbers}\r\n\r\nDie Auflage erfolgt auf der Gemeindekanzlei. Die öffentliche Auflage der massgeblichen digitalen Daten erfolgt gestützt auf Art. 1 und Art. 13 Abs. 1 Bst. a des Gesetzes über die amtliche Publikation (Publikationsgesetz, PUG; RB 3.1310) im Kataster der öffentlich-rechtlichen Eigentumsbeschränkungen (oereb.ur.ch/auflage).\r\n\r\nInnerhalb der Auflagefrist können schriftliche Einsprachen mit bestimmten Begehren und begründet beim Gemeinderat eingereicht werden.\r\n\r\nBemerkungen ans Amtsblatt: {commentsToTheOfficialGazette}\r\n\r\n{location}, {date} {authority}\r\n\r\nWir danken Ihnen für Ihre Bemühungen und stehen bei Fragen gerne zur Verfügung\r\n\r\nFreundliche Grüsse\r\n\r\n{authority}\r\n"
    gemeindlicheBaulinie: "Gemeinde {location} \r\n\r\n{location}, {date}\r\n\r\nMeldung eines Auflage- und Einspracheverfahrens zur Publikation im Amtsblatt unter der Rubrik \"Bau und Planungsrecht\" und im amtlichen Publikationsorgan (APO)\r\n\r\nSehr geehrte Damen und Herren\r\n\r\nWir bitten Sie, folgendes Auflage- und Einspracheverfahren im Amtsblatt vom Freitag {publishDate} bzw. ab Freitag {publishDate} im APO zu publizieren:\r\n\r\nErlass einer gemeindlichen Baulinie in der Gemeinde {location}\r\n\r\nGestützt auf Artikel 49 des Planungs- und Baugesetzes (PBG; RB 40.1111) wird während 30 Tagen die Gemeindliche Baulinie der Gemeinde {location} öffentlich aufgelegt:\r\n\r\nDokumente:\r\n{attachments}\r\n\r\nDie Auflage erfolgt auf der Gemeindekanzlei. Die öffentliche Auflage der massgeblichen digitalen Daten erfolgt gestützt auf Art. 1 und Art. 13 Abs. 1 Bst. a des Gesetzes über die amtliche Publikation (Publikationsgesetz, PUG; RB 3.1310) im Kataster der öffentlich-rechtlichen Eigentumsbeschränkungen (oereb.ur.ch/auflage).\r\n\r\nInnerhalb der Auflagefrist können schriftliche Einsprachen mit bestimmten Begehren und begründet beim Gemeinderat eingereicht werden.\r\n\r\nBemerkungen ans Amtsblatt: {commentsToTheOfficialGazette}\r\n\r\n {location}, {date} {authority}\r\n\r\nWir danken Ihnen für Ihre Bemühungen und stehen bei Fragen gerne zur Verfügung\r\n\r\nFreundliche Grüsse\r\n\r\n{authority}\r\n"
    gemeindlichePlanungszone: "Gemeinde {location} \r\n\r\n{location}, {date}\r\n\r\nMeldung eines Auflage- und Einspracheverfahrens zur Publikation im Amtsblatt unter der Rubrik \"Bau und Planungsrecht\" und im amtlichen Publikationsorgan (APO)\r\n\r\nSehr geehrte Damen und Herren\r\n\r\nWir bitten Sie, folgendes Auflage- und Einspracheverfahren im Amtsblatt vom Freitag {publishDate} bzw. ab Freitag {publishDate} im APO zu publizieren:\r\n\r\nErlass einer gemeindliche Planungszone in der Gemeinde {location}\r\n\r\nGestützt auf Artikel 43 und Artikel 58 des Planungs- und Baugesetzes (PBG; RB 40.1111) wird während 30 Tagen die gemeindliche Planungszone für die Gemeinde {location} öffentlich aufgelegt. Die gemeindliche Planungszone und die Bau- und Nutzungsvorschriften dazu werden gemäss Artikel 59 Absatz 2 PBG rechtswirksam, sobald sie öffentlich aufgelegt sind:\r\n\r\nDokumente:\r\n{attachments}\r\n\r\nDie Auflage erfolgt auf der Gemeindekanzlei. Die öffentliche Auflage der massgeblichen digitalen Daten erfolgt gestützt auf Art. 1 und Art. 13 Abs. 1 Bst. a des Gesetzes über die amtliche Publikation (Publikationsgesetz, PUG; RB 3.1310) im Kataster der öffentlich-rechtlichen Eigentumsbeschränkungen (oereb.ur.ch/auflage).\r\n\r\nInnerhalb der Auflagefrist können schriftliche Einsprachen mit bestimmten Begehren und begründet beim Gemeinderat eingereicht werden.\r\n\r\nBemerkungen ans Amtsblatt: {commentsToTheOfficialGazette}\r\n\r\n {location}, {date} {authority}\r\n\r\nWir danken Ihnen für Ihre Bemühungen und stehen bei Fragen gerne zur Verfügung\r\n\r\nFreundliche Grüsse\r\n\r\n{authority}\r\n"
    kantonaleBaulinie: "Baudirektion Uri\r\n\r\nAltdorf, {date}\r\n\r\nMeldung eines Auflage- und Einspracheverfahrens zur Publikation im Amtsblatt unter der Rubrik \"Direktionen\" und im amtlichen Publikationsorgan (APO)\r\n\r\nSehr geehrte Damen und Herren\r\n\r\nWir bitten Sie die kantonale Baulinie im Amtsblatt vom Freitag {publishDate} bzw. ab Freitag {publishDate} im APO zu publizieren:\r\n\r\nErlass einer kantonalen Baulinie in der Gemeinde {location}\r\n\r\nGestützt auf Artikel 15 des Planungs- und Baugesetzes (PBG; RB 40.1111) wird während 30 Tagen die kantonale Baulinie für die Gemeinde {location} öffentlich aufgelegt:\r\n\r\nDokumente:\r\n{attachments}\r\n\r\nDie Auflage erfolgt bei der Baudirektion Uri, Klausenstrasse 2, 6460 Altdorf. Die öffentliche Auflage der massgeblichen digitalen Daten erfolgt gestützt auf Art. 1 und Art. 13 Abs. 1 Bst. a des Gesetzes über die amtliche Publikation (Publikationsgesetz, PUG; RB 3.1310) im Kataster der öffentlich-rechtlichen Eigentumsbeschränkungen (oereb.ur.ch/auflage).\r\n\r\nInnerhalb der Auflagefrist können schriftliche Einsprachen mit bestimmten Begehren und begründet beim Regierungsrat des Kantons Uri eingereicht werden.\r\n\r\nBemerkungen ans Amtsblatt: {commentsToTheOfficialGazette}\r\n\r\nAltdorf, {date} Baudirektion Uri, Hermann Epp, Regierungsrat\r\n\r\nWir danken Ihnen für Ihre Bemühungen und stehen bei Fragen gerne zur Verfügung\r\n\r\nFreundliche Grüsse\r\n\r\nBaudirektion Uri\r\n"
    kantonaleNutzungsplanung: "Gemeinde {location} \r\n\r\nAltdorf, {date}\r\n\r\nMeldung eines Auflage- und Einspracheverfahrens zur Publikation im Amtsblatt unter der Rubrik \"Bau und Planungsrecht\" und im amtlichen Publikationsorgan (APO)\r\n\r\nSehr geehrte Damen und Herren\r\n\r\nWir bitten Sie, folgendes Auflage- und Einspracheverfahren im Amtsblatt vom Freitag {publishDate} bzw. ab Freitag {publishDate} im APO zu publizieren:\r\n\r\nErlass eines kantonalen Nutzungsplans in der Gemeinde {location}\r\n\r\nGestützt auf Artikel 12 und Artikel 43 des Planungs- und Baugesetzes (PBG; RB 40.1111) wird während 30 Tagen der kantonale Nutzungsplan für die Gemeinde {location} öffentlich aufgelegt:\r\n\r\nDokumente:\r\n{attachments}\r\n\r\nDie Auflage erfolgt auf der Gemeindekanzlei {location}. Die öffentliche Auflage der massgeblichen digitalen Daten erfolgt gestützt auf Art. 1 und Art. 13 Abs. 1 Bst. a des Gesetzes über die amtliche Publikation (Publikationsgesetz, PUG; RB 3.1310) im Kataster der öffentlich-rechtlichen Eigentumsbeschränkungen (oereb.ur.ch/auflage).\r\n\r\nInnerhalb der Auflagefrist können schriftliche Einsprachen mit bestimmten Begehren und begründet beim Regierungsrat des Kantons Uri eingereicht werden.\r\n\r\nBemerkungen ans Amtsblatt: {commentsToTheOfficialGazette}\r\n\r\nAltdorf, {date} Justizdirektion Uri, Daniel Furrer, Regierungsrat\r\n\r\nWir danken Ihnen für Ihre Bemühungen und stehen bei Fragen gerne zur Verfügung\r\n\r\nFreundliche Grüsse\r\n\r\nJustizdirektion Uri\r\n"
    kantonalePlanungszone: "Gemeinde {location} \r\n\r\nAltdorf, {date}\r\n\r\nMeldung eines Auflage- und Einspracheverfahrens zur Publikation im Amtsblatt unter der Rubrik \"Bau und Planungsrecht\" und im amtlichen Publikationsorgan (APO)\r\n\r\nSehr geehrte Damen und Herren\r\n\r\nWir bitten Sie, folgendes Auflage- und Einspracheverfahren im Amtsblatt vom Freitag {publishDate} bzw. ab Freitag {publishDate} im APO zu publizieren:\r\n\r\nErlass einer kantonalen Planungszone in der Gemeinde {location}\r\n\r\nGestützt auf Artikel 12 und Artikel 43 und Artikel 58 des Planungs- und Baugesetzes (PBG; RB 40.1111) wird während 30 Tagen die kantonale Planungszone für die Gemeinde {location} öffentlich aufgelegt. Die kantonale Planungszone und die Bau- und Nutzungsvorschriften dazu werden gemäss Artikel 59 Absatz 2 PBG rechtswirksam, sobald sie öffentlich aufgelegt sind:\r\n\r\nDokumente:\r\n{attachments}\r\n\r\nDie Auflage erfolgt bei der Justizdirektion Uri, Amt für Raumentwicklung, Bahnhofstrasse 1, 6460 Altdorf. Die öffentliche Auflage der massgeblichen digitalen Daten erfolgt gestützt auf Art. 1 und Art. 13 Abs. 1 Bst. a des Gesetzes über die amtliche Publikation (Publikationsgesetz, PUG; RB 3.1310) im Kataster der öffentlich-rechtlichen Eigentumsbeschränkungen (oereb.ur.ch/auflage).\r\n\r\nInnerhalb der Auflagefrist können schriftliche Einsprachen mit bestimmten Begehren und begründet beim Regierungsrat des Kantons Uri eingereicht werden.\r\n\r\nBemerkungen ans Amtsblatt: {commentsToTheOfficialGazette}\r\n\r\nAltdorf, {date} Justizdirektion Uri, Daniel Furrer, Regierungsrat\r\n\r\nWir danken Ihnen für Ihre Bemühungen und stehen bei Fragen gerne zur Verfügung\r\n\r\nFreundliche Grüsse\r\n\r\nJustizdirektion Uri\r\n"
    planerischerGewaesserschutz: "Gesundheits-, Sozial- und Umweltdirektion Uri\n\r\nAltdorf, {date}\r\n\r\nMeldung eines Auflage- und Einspracheverfahrens zur Publikation im Amtsblatt unter der Rubrik \"Direktionen\" und im amtlichen Publikationsorgan (APO)\r\n\r\nSehr geehrte Damen und Herren\r\n\r\nWir bitten Sie, folgendes Auflage- und Einspracheverfahren im Amtsblatt vom Freitag {publishDate} bzw. ab Freitag {publishDate} im APO zu publizieren:\r\n\r\nAusscheidung Gewässerschutzbereich/Grundwasserschutzareal/Grundwasserschutzzone, Gemeinde {location}\r\n\r\nDer/Die Gesuchsteller/in {applicantNamesFormatted} beantragt nach Artikel 20 des Bundesgesetzes über den Schutz der Gewässer vom 24. Januar 1991 (Gewässerschutzgesetz [GSchG]; SR 814.20) und Artikel 13/14 und 15 des kantonalen Umweltgesetzes vom 11. März 2007 (KUG; RB 40.7011) die Ausscheidung einer Grundwasserschutzzone in der Gemeinde {location}.Nach Prüfung der Unterlagen legt der Regierungsrat die vorgesehenen Nutzungsbeschränkungen und Schutzmassnahmen zusammen mit dem dazugehörigen Schutzzonenplan während 30 Tagen öffentlich auf. Jede betroffene Person und Körperschaft hat das Recht, ab {publishDate}:\r\n\r\na) Einsicht zu nehmen in die vorgesehenen Nutzungsbeschränkungen und Schutzmassnahmen mit dem dazugehörigen Schutzzonenplan. Diese liegen bei der Gemeindekanzlei {location} sowie der Gesundheits-, Sozial- und Umweltdirektion Uri, Amt für Umweltschutz, Klausenstrasse 4, 6460 Altdorf auf. Die öffentliche Auflage der massgeblichen digitalen Daten erfolgt gestützt auf Art. 1 und Art. 13 Abs. 1 Bst. a des Gesetzes über die amtliche Publikation (Publikationsgesetz, PUG; RB 3.1310) im Kataster der öffentlich-rechtlichen Eigentumsbeschränkungen (oereb.ur.ch/auflage).;\r\n\r\nb) schriftlich und begründet Einsprache beim Regierungsrat des Kantons Uri zu erheben.\r\n\r\nBemerkungen ans Amtsblatt: {commentsToTheOfficialGazette}\r\n\r\nAltdorf, {date} Gesundheits-, Sozial- und Umweltdirektion Uri, Christian Arnold, Regierungsrat\r\n\r\nWir danken Ihnen für Ihre Bemügungen und stehen bei Fragen gerne zur Verfügung\r\n\r\nFreundliche Grüsse\r\n\r\nGesundheits-, Sozial- und Umweltdirektion Uri\r\n"
    schutzmassnahmen: "Gemeinde {location} \r\n\r\nAltdorf, {date}\r\n\r\nMeldung eines Auflage- und Einspracheverfahrens zur Publikation im Amtsblatt unter der Rubrik \"Bau und Planungsrecht\" und im amtlichen Publikationsorgan (APO)\r\n\r\nSehr geehrte Damen und Herren\r\n\r\nWir bitten Sie, folgendes Auflage- und Einspracheverfahren im Amtsblatt vom Freitag {publishDate} bzw. ab Freitag {publishDate} im APO zu publizieren:\r\n\r\nErlass von Schutzmassnahmen in der Gemeinde {location}\r\n\r\nGestützt auf Artikel 11 Absatz 1 des Gesetzes über den Natur- und Heimatschutz (kNHG; RB 10.5101) und Artikel 43 des Planungs- und Baugesetzes (PBG; RB 40.1111) oder Artikel 55 des Planungs- und Baugesetzes (PBG; RB 40.1111) werden während 30 Tagen die Schutzmassnahmen für {intent} in der Gemeinde {location} öffentlich aufgelegt:\r\n\r\nDokumente:\r\n{attachments}\r\n\r\nDie Auflage erfolgt auf der Gemeindekanzlei {location} und bei der Justizdirektion Uri, Bahnhofstrasse 1, 6460 Altdorf. Die öffentliche Auflage der massgeblichen digitalen Daten erfolgt gestützt auf Art. 1 und Art. 13 Abs. 1 Bst. a des Gesetzes über die amtliche Publikation (Publikationsgesetz, PUG; RB 3.1310) im Kataster der öffentlich-rechtlichen Eigentumsbeschränkungen (oereb.ur.ch/auflage).\r\n\r\nInnerhalb der Auflagefrist können schriftliche Einsprachen mit bestimmten Begehren und begründet beim Regierungsrat des Kantons Uri eingereicht werden.\r\n\r\nBemerkungen ans Amtsblatt: {commentsToTheOfficialGazette}\r\n\r\nAltdorf, {date} Justizdirektion Uri, Daniel Furrer, Regierungsrat\r\n\r\nWir danken Ihnen für Ihre Bemühungen und stehen bei Fragen gerne zur Verfügung\r\n\r\nFreundliche Grüsse\r\n\r\nJustizdirektion Uri\r\n"
    bausperre: "Gemeinde {location},\r\n\r\n{location}, {date}\r\n\r\nMeldung eines Auflage- und Einspracheverfahrens zur Publikation im Amtsblatt unter der Rubrik \"Auflage- und Einspracheverfahren\" und im amtlichen Publikationsorgan (APO)\r\n\r\nSehr geehrte Damen und Herren\r\n\r\nWir bitten Sie, folgendes Auflage- und Einspracheverfahren im Amtsblatt vom Freitag {publishDate} bzw. ab Freitag {publishDate} im APO zu publizieren:\r\n\r\nBausperre in der Gemeinde {location}\r\n\r\nMit Beschluss vom DATUM hat der Gemeinderat {location} gestützt auf Art. 60ff Planungs- und Baugesetz des Kantons Uri (PBG; RB 40.1111) über folgende Gebiete im Sinne einer vorsorglichen Massnahme die Bausperre verfügt:\r\n\r\n- Z.B: PARZELLE NR. XXX ODER KERNZONE\r\n\r\nBEISPIEL ZWECK:\r\nDie Bausperre bezweckt, künftige planerische Massnahmen in der Kernzone sicherzustellen sowie genügende Bauvorschriften zu schaffen. Bauliche Massnahmen im gesperrten Gebiet werden nur bewilligt, wenn sie der vorgesehenen Planung bzw. die Verwirklichung der neuen Vorschrift nicht erschweren oder beeinträchtigen.\r\n\r\nBEISPIEL DAUER:\r\nDie Bausperre gilt bis zum Inkrafttreten der vorgenannten Vorschrift in der Kernzone, jedoch längstens für ein Jahr.\r\n\r\nDie Auflage erfolgt auf der Gemeindekanzlei. Die öffentliche Auflage der massgeblichen digitalen Daten erfolgt gestützt auf Art. 1 und Art. 13 Abs. 1 Bst. a des Gesetzes über die amtliche Publikation (Publikationsgesetz, PUG; RB 3.1310) im Kataster der öffentlich-rechtlichen Eigentumsbeschränkungen (oereb.ur.ch/auflage).\r\n\r\nBemerkungen ans Amtsblatt: {commentsToTheOfficialGazette}\r\n\r\n{location}, {date} Gemeinderat {location}\r\n\r\nWir danken Ihnen für Ihre Bemühungen und stehen bei Fragen gerne zur Verfügung\r\n\r\nFreundliche Grüsse\r\n\r\nGemeinderat {location}"

