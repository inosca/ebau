caluma:
  distribution:
    inquiry:
      sent-at: "Data di inizio"
    edit:
      edit-sent: '<b>Attenzione:</b> il destinatario non viene informato della modifica della presa di posizione. Una nuova presa di posizione deve essere richiesta con il simbolo "+".'
    reopen-inquiry:
      confirm: 'Riaprire davvero la richiesta? L''organizzazione interessata verrà informata e la presa di posizione precedente verrà ripristinata.<br /><br /><span uk-icon="icon: info" class="uk-text-warning"></span> Suggerimento: per richiedere un''ulteriore presa di posizione, utilizzare invece il simbolo “+”. In questo modo si conserva lo storico delle risposte precedenti.'
