legal-submission:
  header: "Rivendicazione"
  hint: Lo scritto dell'opposizione può essere archiviato nella cartella «opposizioni». Si prega di notare che il registro «Opposizioni/Ricorso» rappresenta solamente un aiuto, la procedura di opposizione non può essere svolta sulla piattaforma eBau.
  hint-appeal: La lettera di ricorso può essere archiviata nella cartella «ricorso». Vi preghiamo di tenere presente che il registro «Opposizioni/Ricorso» rappresenta solamente un aiuto e che la procedura di ricorso non può essere svolta tramite eBau.
