legal-submission:
  header: "Opposizioni"
  hint: |
    <p>La preghiamo di osservare che il registrot «Opposizioni/Ricorsi» rappresenta solamente un aiuto per la gestione completa del dossier e che la procedura di opposizione non può essere svolta in modo digitale tramite eBau.</p>
    <p>Per ogni opposizione (con una o più persone firmatarie) occorre creare un'iscrizione separata (tramite il segno più).</p>
