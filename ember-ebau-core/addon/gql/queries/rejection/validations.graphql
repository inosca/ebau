query RejectionValidations(
  $instanceId: GenericScalar!
) {
  distribution: allWorkItems(
    filter: [
      { task: "inquiry" }
      { rootCaseMetaValue: { key: "camac-instance-id", value: $instanceId } }
      { status: READY }
    ]
  ) {
    totalCount
  }
  claims: allWorkItems(
    filter: [
      { task: "additional-demand" }
      { rootCaseMetaValue: { key: "camac-instance-id", value: $instanceId } }
      { status: READY }
    ]
  ) {
    totalCount
  }
}
