# template: login
loginHeading=Anmeldung
loginProviderHint=Bitte wählen Sie einen Anmeldedienste aus:
loginFaqHeading=Fragen und Antworten
loginFaqContent=<h4>Welche Anmeldedienste wähle ich aus?</h4><p>Alle natürlichen Personen und Mitarbeitende von Organisationen ausserhalb der Kantons-verwaltung benötigen ein BE-Login/AGOV Konto, um sich anzumelden.</p><p>Mitarbeitende der Kantonsverwaltung mit einer @be.ch E-Mail-Adresse wählen AD Kanton Bern aus.</p>\
<h4>Wo erhalte ich Hilfe?</h4><p>Haben Sie Fragen zu BE-Login oder brauchen Sie Hilfe bei der Anmeldung?</p><p>Wir sind rund um die Uhr für Sie da. Informationen wie Sie uns erreichen können finden Sie auf folgender Seite:</p>
loginFaqLinkText=Support Informationen
loginFaqLinkTarget=#

# custom fedback box
# * displayed directly after keycloak native box. Only visible if a feedbackbox-message is defined
# * possible types for the feedbackbox: info(default),warning,error,success
feedbackbox-type=info
feedbackbox-message=<h4>Test</h4><p>Some <b>very</b> important notice. Wir haben festgestellt, dass nicht alle Angaben zu ihrem Benutzerkonto übertragen wurden. Bitte erfassen Sie die untenstehenden Angaben. Erfassen Sie bitte in jedem Fall die selbe E-Mail-Adresse welche dem Mitarbeiterkonto zugewiesen ist.</p>

# template:login-idp-link-confirm
loginIdpLinkConfirmTitle=Es ist bereits ein Benutzerkonto mit selber E-Mail Adresse vorhanden
loginIdpLinkConfirmMessage=<p>Wir haben festgestellt, dass bereits ein eBau Benutzerkonto mit der E-Mail Adresse {0} vorhanden ist, die Benutzer-ID jedoch abweicht. Es könnte sein, dass Ihr BE-Login/ADFS Benutzerkonto kürzlich neu erstellt oder geändert wurde.</p> \
<p>Sie können das eBau Benutzerkonto mit Ihrem aktuellen BE-Login/ADFS neu verknüpfen. Dazu müssen Sie sich neu authentifizieren. Danach wird Ihr eBau Benutzerkonto angepasst.</p> \
<p>Danke für Ihr Verständnis, ihr eBau Team</p>

# template: idp-review-user-profile
loginIdpReviewProfileTitle=Hoppla da ist etwas schief gelaufen
loginIdpReviewProfileMessage=<p>Wir haben festgestellt, dass nicht alle Angaben zu ihrem Benutzerkonto übertragen wurden. Bitte erfassen Sie die untenstehenden Angaben. Erfassen Sie bitte in jedem Fall die selbe E-Mail-Adresse welche dem Mitarbeiterkonto zugewiesen ist.</p> \
<p>Danke für Ihr Verständnis, ihr eBau Team</p>

