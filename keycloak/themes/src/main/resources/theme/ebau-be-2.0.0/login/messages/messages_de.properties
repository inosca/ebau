loginMessageContentHtml=<p>Liebe Anwenderinnen und Anwender</p> \
	<p>Seit Anfang Dezember 2024 besteht die Möglichkeit, BE-Login mit AGOV als Authentifizierungsdienst zu nutzen. Bitte beachten Sie, dass Firmen- bzw. Mitarbeiter-Konten AGOV noch nicht nutzen können. Nutzende mit Mitarbeiter-Login werden gebeten, sich wie bisher mit dem Mitarbeiter-Login (Firma:Name) bei BE-Login anzumelden.</p> \
	<p>Falls Sie Unterstützung benötigen oder Fragen zu BE-Login/AGOV haben, dann wenden Sie sich bitte direkt an den <a href="https://www.kaio.fin.be.ch/de/start/ueber-uns/kontaktformular-be-login.html">BE-Login/AGOV Support</a>. Telefon +41 31 636 99 99.</p> \
	<p>Weitere Informationen: <a href="https://www.kaio.fin.be.ch/de/start/dienstleistungen/BE-Login_mit_AGOV.html">BE-Login mit AGOV</a></p> \
	<p>Vielen Dank und freundliche Grüsse<br />Ihr eBau-Team \</p>
loginIdpLinkConfirmTitle=Es ist bereits ein Benutzerkonto mit selber E-Mail Adresse vorhanden
loginIdpLinkConfirmMessage=<p>Wir haben festgestellt, dass bereits ein eBau Benutzerkonto mit der E-Mail Adresse {0} vorhanden ist, die Benutzer-ID jedoch abweicht. Es könnte sein, dass Ihr BE-Login/ADFS Benutzerkonto kürzlich neu erstellt oder geändert wurde.</p> \
<p>Sie können das eBau Benutzerkonto mit Ihrem aktuellen BE-Login/ADFS neu verknüpfen. Dazu müssen Sie sich neu authentifizieren. Danach wird Ihr eBau Benutzerkonto angepasst.</p> \
<p>Danke für Ihr Verständnis, ihr eBau Team</p>
loginIdpReviewProfileTitle=Hoppla da ist etwas schief gelaufen
loginIdpReviewProfileMessage=<p>Wir haben festgestellt, dass nicht alle Angaben zu ihrem Benutzerkonto übertragen wurden. Bitte erfassen Sie die untenstehenden Angaben. Erfassen Sie bitte in jedem Fall die selbe E-Mail-Adresse welche dem Mitarbeiterkonto zugewiesen ist.</p> \
<p>Danke für Ihr Verständnis, ihr eBau Team</p>

