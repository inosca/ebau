loginMessageTitle=Remarques importantes sur l''utilisation/l''enregistrement BE-Login/AGOV
loginMessageContentHtml=<p>Chères utilisatrices, chers utilisateurs,</p> \
	<p>Depuis début décembre 2024, il est possible d''utiliser BE-Login avec AGOV comme service d''authentification. Veuillez noter que les comptes d''entreprise ou les comptes d''utilisateur ne permettent pas encore de recourir à AGOV. Les personnes disposant d''un accès en tant que collaboratrice ou collaborateur sont priées de se connecter à BE-Login comme auparavant avec leur identifiant (société:nom).</p> \
	<p>Si vous avez besoin d''aide ou si vous avez des questions sur BE-Login/AGOV, veuillez contacter directement le service d''assistance <a href="https://www.kaio.fin.be.ch/fr/start/ueber-uns/kontaktformular-be-login.html">BE-Login/AGOV</a>. Téléphone +41 31 636 99 98.</p> \
	<p>Informations complémentaires : <a href="https://www.kaio.fin.be.ch/fr/start/dienstleistungen/BE-Login_mit_AGOV.html">Accès à BE-Login avec AGOV</a></p> \
	<p>Nous vous remercions et vous adressons nos salutations les meilleures.<br />Votre équipe eBau</p>
loginIdpLinkConfirmTitle=Il existe déjà un compte d'utilisateur avec la même adresse e-mail
loginIdpLinkConfirmMessage=<p>Nous avons constaté qu'il existe déjà un compte utilisateur eBau avec l'adresse e-mail {0}, mais que l'ID utilisateur est différent. Il se peut que votre compte d'utilisateur BE-Login/ADFS ait été récemment recréé ou modifié.</p> \
<p>Vous pouvez relier à nouveau le compte d'utilisateur eBau à votre BE-Login/ADFS actuel. Pour cela, vous devez vous authentifier à nouveau. Ensuite, votre compte utilisateur eBau sera adapté.</p> \
<p>Merci de votre compréhension, votre équipe eBau</p>.
loginIdpReviewProfileTitle=Oups, quelque chose a mal tourné
loginIdpReviewProfileMessage=<p>Nous avons constaté que toutes les informations relatives à votre compte utilisateur n'ont pas été transmises. Veuillez saisir les informations ci-dessous. Veuillez saisir dans tous les cas la même adresse e-mail que celle attribuée au compte du collaborateur.</p> \
<p>Merci pour votre compréhension, votre équipe eBau</p>.

