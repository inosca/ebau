emailLinkIdpHint2=Vous n’avez pas reçu le lien d’activation par courriel? Veuillez vérifier le dossier des pourriels et indésirables de votre messagerie. Si vous n’y trouvez pas de courriel, cliquez sur le bouton ci-dessous pour générer l’envoi d’un nouveau lien.
emailLinkIdpHint2Button=Demander un nouveau lien d’activation
emailLinkIdpHint3=Si vous avez procédé à la vérification dans une autre fenêtre de votre navigateur, cliquez sur le bouton ci-dessous.
emailLinkIdpHint3Button=Lien vers le service numérique
emailLinkIdpContextMessage=<h4>Pourquoi ce message s’affiche-t-il?</h4>\
<p>Ce message s’affiche lorsque le processus de réattribution du compte est lancé.</p>\
<p>Veuillez consulter votre boîte électronique et, éventuellement, vérifier le dossier des pourriels et indésirables de votre messagerie avant de prendre contact avec le service d’assistance.</p>\
<p>Si vous n’y trouvez par de courriel contenant un lien, appelez le service d’assistance (disponible 24h/24):</p>
