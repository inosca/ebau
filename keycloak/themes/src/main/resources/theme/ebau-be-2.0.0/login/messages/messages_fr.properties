<div class="box"><span>Support BE-Login</span><span>tél. +41 31 636 99 98</span>\
<span>Horaires</span><span>du lundi au dimanche<br>24h sur 24</span></div>\
<h4>Vous avez besoin d’aide?</h4>\
<div class="arrow-link"><span class="link-arrow"></span><a target="_blank" href="https://www.kaio.fin.be.ch/de/start/ueber-uns/kontaktformular-be-login.html">Formulaire de contact BE-Login</a></div>\
<br>\
<p>Les membres du personnel cantonal (utilisant le compte ADFS et disposant d’une adresse électronique cantonale ...@be.ch) sont priés d’utiliser directement le portail en libre-service: <a href="https://beitsmsprod.service-now.com/ict">https://beitsmsprod.service-now.com/ict</a></p>\
</div>

# template: login
loginHeading=Connexion
loginProviderHint=Choisissez l’un des services d’authentification suivants:
loginFaqHeading=Questions et réponses
loginFaqContent=<h4>Quel service d’authentification choisir?</h4><p>Le compte BE-Login/AGOV doit être utilisé par l’ensemble des personnes physiques ainsi que des collaboratrices et collaborateurs d’organismes extérieurs à l’administration cantonale.</p><p>Le personnel cantonal disposant d’une adresse électronique @be.ch se sert du service d’annuaire (active directory) du canton de Berne.</p>\
<h4>Où trouver de l’aide?</h4><p>Des questions au sujet de BE-Login? Besoin d’aide pour la connexion?</p><p>Vous pouvez nous atteindre 24 heures sur 24. Pour en savoir plus, cliquez sur le lien suivant:</p>
loginFaqLinkText=Informations sur le service d’assistance
loginFaqLinkTarget=#

# template:login-idp-link-confirm
confirmLinkIdpTitle=Connexion
federatedIdentityConfirmLinkMessage=L’adresse électronique {1} est déjà rattachée à un compte. Voici ce que vous pouvez faire:
loginIdpLinkConfirmContextMessage=<h4>Pourquoi ce message s’affiche-t-il?</h4>\
<p>Ce message s’affiche parce que l’adresse électronique est déjà liée à un compte, mais que son identifiant est différent. </p>\
<p>Cela peut se produire lorsqu’une adresse est réutilisée pour créer un nouveau compte BE-Login/AGOV. </p>\
<p>Vous pouvez régler le problème en cliquant sur «réattribuer le compte». Vous recevrez un courriel contenant un lien d’activation. Si vous cliquez sur ce lien, votre compte sera lié à votre adresse électronique.</p>\
<p>Si vous avez besoin d’aide, appelez le service d’assistance (disponible 24h/24):</p>
loginIdpLinkConfirmContextMessageLinkTarget=tel:+41 31 636 99 97
loginIdpLinkConfirmContextMessageLinkText=Tel. +41 31 636 99 97

# template: login-idp-link-confirm-override
confirmOverrideIdpTitle=Connexion
federatedIdentityConfirmOverrideMessage=<p>Il a été constaté qu'un compte utilisateur eBau existe déjà avec la même adresse électronique, mais que le nom d'utilisateur (ID utilisateur) est différent. Il se peut que votre compte utilisateur {1} ait été récemment créé ou modifié.</p>\
<p>Vous pouvez connecter le compte utilisateur eBau existant à votre compte {1} actuel. Pour ce faire, cliquez sur le bouton ci-dessous. Vous recevrez ensuite un courriel de confirmation avec un lien d'activation. Veuillez confirmer ce lien afin de reconnecter votre compte utilisateur eBau.</p>\
<br>\
<p>Merci pour votre aide, l'équipe eBau</p>
confirmOverrideIdpContinue=Connecter le compte utilisateur eBau au compte BE-Login/ADFS actuel
loginIdpLinkConfirmOverrideContextMessage=<h4>Pourquoi ce message s’affiche-t-il?</h4>\
<p>Ce message s’affiche parce que l’adresse électronique est déjà liée à un compte, mais que son identifiant est différent. </p>\
<p>Cela peut se produire lorsqu’une adresse est réutilisée pour créer un nouveau compte BE-Login/AGOV. </p>\
<p>Vous pouvez régler le problème en cliquant sur «réattribuer le compte». Vous recevrez un courriel contenant un lien d’activation. Si vous cliquez sur ce lien, votre compte sera lié à votre adresse électronique.</p>\
<p>Si vous avez besoin d’aide, appelez le service d’assistance (disponible 24h/24):</p>
loginIdpLinkConfirmOverrideContextMessageLinkTarget=tel:+41 31 636 99 97
loginIdpLinkConfirmOverrideContextMessageLinkText=Tel. +41 31 636 99 97

# template: idp-review-user-profile
loginIdpReviewProfileTitle=Profil utilisateur
loginIdpReviewProfileMessage=<p>Nous avons constaté que toutes les informations relatives à votre compte utilisateur n'ont pas été transmises. Veuillez saisir les informations ci-dessous. Veuillez saisir dans tous les cas la même adresse e-mail que celle attribuée au compte du collaborateur.</p> \
<p>Merci pour votre compréhension, votre équipe eBau</p>.
loginIdpReviewProfileContextMessage=<h4>Comment modifier des informations liées au compte?</h4>\
<p>Les informations affichées sont automatiquement reprises par le service d’authentification choisi. Leur modification sur cette page n’est que temporaire. Pour une modification à long terme, voici comment procéder:</p>\
<h4>BE-Login/AGOV</h4>\
<p>Pour changer les données de votre compte, suivez le lien <a href="www.agov.ch/me">www.agov.ch/me</a><br>\
Pour les comptes des collaboratrices ou collaborateurs, il convient de contacter la personne responsable au sein de la structure.</p>\
<h4>Active directory du canton de Berne</h4>\
<p>Le personnel cantonal doit prendre contact directement avec l’OIO dans le portail en libre-service.</p>

