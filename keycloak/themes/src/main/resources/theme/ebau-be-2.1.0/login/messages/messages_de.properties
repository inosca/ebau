<p>Sie können das Problem selbst beheben, in dem Sie die Schaltfläche "Benutzerkonto neu verbinden" auswählen. Sie erhalten anschliessend eine E-Mail-Nachricht mit einem Aktivierungslink. Wenn Sie diesen bestätigen, wird Ihr Benutzerkonto neu verbunden.</p>\
<p>Wenn Sie Unterstützung benötigen, dann wenden Sie sich an folgenden Supportstelle (rund um die Uhr):</p>
