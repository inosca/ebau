# template: login
loginHeading=Anmelden
loginProviderHint=Bitte wählen Sie einen Anmeldedienste aus:
loginFaqHeading=Fragen und Antworten
loginFaqContent=<h4>Welche Anmeldedienste wähle ich aus?</h4><p>Alle natürlichen Personen und Mitarbeitende von Organisationen ausserhalb der Kantons-verwaltung benötigen ein BE-Login/AGOV Konto, um sich anzumelden.</p><p>Mitarbeitende der Kantonsverwaltung mit einer @be.ch E-Mail-Adresse wählen AD Kanton Bern aus.</p>\
<h4>Wo erhalte ich Hilfe?</h4><p>Haben Sie Fragen zu BE-Login oder brauchen Sie Hilfe bei der Anmeldung?</p><p>Wir sind rund um die Uhr für Sie da. Informationen wie Sie uns erreichen können finden Sie auf folgender Seite:</p>
loginFaqLinkText=Support Informationen
loginFaqLinkTarget=https://www.dij.be.ch/de/start/ueber-uns/kontaktformular.html

# template:login-idp-link-confirm
confirmLinkIdpTitle=Anmelden
federatedIdentityConfirmLinkMessage=Es existiert bereits ein Benutzerkonto mit der E-Mail-Adresse {1}. Sie haben folgende Optionen:
loginIdpLinkConfirmContextMessage=<h4>Weshalb erhalte ich diese Meldung?</h4>\
<p>Die Meldung weist darauf hin, dass bereits ein Benutzerkonto mit derselben E-Mail-Adresse existiert, jedoch die Benutzer-ID abweicht.</p>\
<p>Das kann vorkommen, wenn z.B. ein neues BE-Login/AGOV Konto mit derselben E-Mail-Adresse erstellt wurde.</p>\
<p>Sie können das Problem selbst beheben, in dem Sie die Schaltfläche "Benutzerkonto neu verbinden" auswählen. Sie erhalten anschliessend eine E-Mail-Nachricht mit einem Aktivierungslink. Wenn Sie diesen bestätigen, wird Ihr Benutzerkonto neu verbunden.</p>\
<p>Wenn Sie Unterstützung benötigen, dann wenden Sie sich an folgenden Supportstelle (rund um die Uhr):</p>
loginIdpLinkConfirmContextMessageLinkTarget=tel:+41 31 636 99 97
loginIdpLinkConfirmContextMessageLinkText=Tel. +41 31 636 99 97

# template: login-idp-link-confirm-override
confirmOverrideIdpTitle=Anmelden
federatedIdentityConfirmOverrideMessage=<p>Wir haben festgestellt, dass bereits ein eBau Benutzerkonto mit der selben E-Mail Adresse existiert, jedoch die Benutzer-ID abweicht. Es könnte sein, dass Ihr {1} Benutzerkonto kürzlich neu erstellt oder geändert wurde.</p>\
<p>Sie können das existierende eBau Benutzerkonto mit Ihrem aktuellen {1} Konto verbinden. Klicken Sie dazu auf die Schaltfläche unten. Sie erhalten anschliessend eine Bestätigungs-E-Mail mit einem Aktivierungslink. Bitte bestätigen Sie diesen um Ihr eBau Benutzerkonto neu zu verbinden.</p>\
<br>\
<p>Danke für Ihr Verständnis, Ihr eBau-Team</p>
confirmOverrideIdpContinue=eBau Benutzerkonto mit aktuellem BE-Login/ADFS Konto verbinden
