# template: idp-review-user-profile
loginIdpReviewProfileTitle=Benutzerprofil
loginIdpReviewProfileMessage=<p>Wir haben festgestellt, dass nicht alle Angaben zu ihrem Benutzerkonto übertragen wurden. Bitte erfassen Sie die untenstehenden Angaben. Erfassen Sie bitte in jedem Fall die selbe E-Mail-Adresse welche dem Mitarbeiterkonto zugewiesen ist.</p> \
<p>Danke für Ihr Verständnis, ihr eBau Team</p>
loginIdpReviewProfileContextMessage=<h4>Wie kann ich meine Kontoinformationen ändern?</h4>\
<p>Die angezeigten Informationen werden automatisch vom ausgewählten Anmeldedienst übernommen und können hier nur temporär geändert werden. Um diese zu anzupassen, gehen Sie wie folgt vor:</p>\
<h4>BE-Login/AGOV</h4>\
<p>Um Ihre Angaben im Benutzerkonto zu ändern, gehen Sie auf folgende Seite: <a href="www.agov.ch/me">www.agov.ch/me</a><br>\
Bei Mitarbeiterkonten wenden Sie sich an die verantwortliche Person im Unternehmen.</p>\
<h4>AD Kanton Bern</h4>\
<p>Mitarbeitende des Kantons wenden Sie bitte direkt an das KAIO via Self-Service Portal.</p>

# template: login-idp-link-email
emailLinkIdpTitle=Anmelden
emailLinkIdpHint1=Eine E-Mail-Nachricht mit weiteren Anweisungen um Ihr Benutzerkonto <strong>{0}</strong> neu zu verbinden wurde an Sie versendet.
emailLinkIdpHint2=Sie haben keinen Aktivierungslink per E-Mail erhalten? Dann prüfen Sie bitte den SPAM/Junk-Mail Ordner in Ihrem Postfach. Ansonsten klicken Sie auf die untenstehende Schaltfläche, um einen neuen Aktivierungslink versenden zu lassen.
emailLinkIdpHint2Button=Aktivierungslink nochmal anfordern
emailLinkIdpHint3=Wenn Sie die E-Mail bereits in einem anderen Browser-Fenster verifiziert haben, dann klicken Sie auf die untenstehende Schaltfläche, um fortzufahren.
emailLinkIdpHint3Button=Weiter zum eService
emailLinkIdpContextMessage=<h4>Weshalb erhalte ich diese Meldung?</h4>\
<p>Sie erhalten diese Meldung, weil der Prozess zum Neuverbinden des Benutzerkontos gestartet wurde.</p>\
<p>Bitte prüfen Sie in jedem Fall Ihr Postfach und gegebenenfalls den SPAM oder Junk-Mail Ordner in Ihrem E-Mail-System, bevor Sie mit dem Support Kontakt aufnehmen.</p>\
<p>Falls Sie trotzdem keine E-Mail-Nachricht mit dem Aktivierungslink erhalten haben, dann wenden Sie sich bitte an folgenden Supportstelle (rund um die Uhr):</p>
emailLinkIdpContextMessageLinkTarget=tel:+41 31 636 99 97
